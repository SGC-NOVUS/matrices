e reason, even running as root.\n# This is changed at the end of the install process anyways.\nchown -R root:root /home/container\nexport HOME=/home/container\n\n## install game using steamcmd\n./steamcmd.sh +force_install_dir /home/container +login ${STEAM_USER:-anonymous} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' || printf %s '+@sSteamCmdForcePlatformType linux' ) +app_update ${SRCDS_APPID:-4020} ${EXTRA_FLAGS} validate +quit\n\n## set up 32 bit libraries\nmkdir -p /home/container/.steam/sdk32\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\n## set up 64 bit libraries\nmkdir -p /home/container/.steam/sdk64\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\n\n## set up MySQLOO\necho \"=== Установка последней версии MySQLOO ===\"\nmkdir -p /home/container/garrysmod/lua/bin\ncd /home/container\nLATEST_MYSQLOO=$(curl -s https://api.github.com/repos/FredyH/MySQLOO/releases/latest | jq -r '.assets[] | select(.name == \"gmsv_mysqloo_linux.dll\") | .browser_download_url')\n\nif [ -n \"$LATEST_MYSQLOO\" ] && [ \"$LATEST_MYSQLOO\" != \"null\" ]; then\n    curl -sL \"$LATEST_MYSQLOO\" -o /home/container/garrysmod/lua/bin/gmsv_mysqloo_linux.dll\n    echo \"MySQLOO успешно скачан и установлен.\"\nelse\n    echo \"Ошибка получения ссылки на MySQLOO.\"\nfi\n\n# Creating needed default files for the game\ncd /home/container/garrysmod/lua/autorun/server\necho '-- Docs: https://wiki.garrysmod.com/page/resource/AddWorkshop\n-- Place the ID of the workshop addon you want to be downloaded to people who join your server, not the collection ID\n-- Use https://beta.configcreator.com/create/gmod/resources.lua to easily create a list based on your collection ID\nresource.AddWorkshop( \"\" )' > workshop.lua\n\ncd /home/container/garrysmod/cfg\necho '// Please do not set RCon, Hostname, Password, Region, Location or URLs in here; use the startup parameters in panel.\n\n// Steam Server List Settings\nsv_lan \"0\"\nsv_max_queries_sec_global \"30000\"\nsv_max_queries_window \"45\"\nsv_max_queries_sec \"5\"\n\n// Server Limits\nsbox_maxprops       100\nsbox_maxragdolls    5\nsbox_maxnpcs        10\nsbox_maxballoons    10\nsbox_maxeffects     10\nsbox_maxdynamite    10\nsbox_maxlamps       10\nsbox_maxthrusters   10\nsbox_maxwheels      10\nsbox_maxhoverballs  10\nsbox_maxvehicles    20\nsbox_maxbuttons     10\nsbox_maxsents       20\nsbox_maxemitters    5\nsbox_godmode        0\nsbox_noclip         0\n\n// Network Settings - Please keep these set to default.\nsv_minrate          75000\nsv_maxrate          0\ngmod_physiterations 2\nnet_splitpacket_maxrate 45000\ndecalfrequency      12\n\n// Execute Ban Files - Please do not edit\nexec banned_ip.cfg\nexec banned_user.cfg\n\n// Add custom lines under here' > server.cfg","ports_config":{"client":{"name":"Client Port","default_port":27005,"protocol":"udp","env_variable":"CLIENT_PORT","description":"Port used by the game client to connect."},"primary":{"name":"Primary Port","default_port":27015,"protocol":"tcp+udp","env_variable":"SERVER_PORT","description":"Primary server port used for connections and RCON."},"reserve":{"name":"Reserve Port","default_port":27016,"protocol":"tcp+udp","env_variable":"SERVER_PORT_RESERVE","description":"Reserve server port allocated in case of primary port issues or secondary services."},"sourcetv":{"name":"SourceTV Port","default_port":27025,"protocol":"udp","env_variable":"SOURCETV_PORT","description":"Port used for broadcasting matches via SourceTV."}},"variables":[{"name":"Server Hostname","description":"The public name of your server displayed in the server browser.","env_variable":"SERVER_HOSTNAME","default_value":"New Gmod Server","user_viewable":true,"user_editable":true,"rules":"required|string|max:128","ui_group":"general"},{"name":"Server Password","description":"Password to protect the server. Leave empty for a public server.","env_variable":"SERVER_PASSWORD","default wable":true,"user_editable":true,"rules":"nullable|string|alpha_num|size:32","ui_group":"security"},{"name":"Game AppID (Client)","description":"AppID 4000 is the Garry's Mod client identifier. Used by panel auto-generators. Do not modify.","env_variable":"GAME_APPID","default_value":"4000","user_viewable":false,"user_editable":false,"rules":"required|integer|in:4000"},{"name":"Source AppID (Server)","description":"AppID 4020 is used by SteamCMD to download server files. Do not modify.","env_variable":"SRCDS_APPID","default_value":"4020","user_viewable":false,"user_editable":false,"rules":"required|integer|in:4020"},{"name":"Workshop ID","description":"The ID of your Steam Workshop collection (numbers at the end of the URL).","env_variable":"WORKSHOP_ID","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|numeric","ui_group":"gameplay"},{"name":"Gamemode","description":"The default gamemode folder name (e.g., sandbox, darkrp, terrortown).","env_variable":"GAMEMODE","default_value":"sandbox","user_viewable":true,"user_editable":true,"rules":"required|string|alpha_dash","ui_group":"gameplay"},{"name":"Max Players","description":"The maximum number of players allowed on the server.","env_variable":"MAX_PLAYERS","default_value":"32","user_viewable":true,"user_editable":true,"rules":"required|integer|max:128","ui_group":"gameplay"},{"name":"Tickrate","description":"Determines server updates per second. Default is 33. Higher values heavily load the CPU.","env_variable":"TICKRATE","default_value":"33","user_viewable":true,"user_editable":true,"rules":"required|integer|max:100","ui_group":"gameplay"},{"name":"Lua Refresh","description":"1 to enable, 0 to disable Lua autorefresh (Disable on production to save resources).","env_variable":"LUA_REFRESH","default_value":"0","user_viewable":true,"user_editable":true,"rules":"required|boolean","ui_group":"security"}]},"ru":{"variables":{},"ports_config":{}},"uk":{"variables":{},"ports_config":{}}}}]}]};

        .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; }
        .markdown-body p { margin-bottom: 1rem; color: #9ca3af; line-height: 1.6; }
        .markdown-body a { color: #0EA5E9; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #9ca3af; }
        .markdown-body code { background: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; }
        .markdown-body pre code { display: block; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">
    <div class="bg-glow"></div>
    
    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-50 w-full border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                    <img src="https://github.com/SGC-NOVUS.png" alt="SGC-NOVUS" class="h-8 w-8 rounded-md">
                    <span class="font-bold text-xl tracking-tight">NOVUS-OS <span class="text-novus-accent">Matrices</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <select id="lang-select" onchange="setLang(this.value)" class="bg-novus-800 text-white text-sm rounded-lg focus:ring-novus-accent focus:border-novus-accent block px-2 py-1 outline-none border border-white/10 cursor-pointer">
                    </select>
                      <a href="https://github.com/SGC-NOVUS/matrices" class="text-gray-400 hover:text-white transition-colors"><i class="fab fa-github text-xl"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        
        <!-- View: HOME -->
        <div id="view-home" class="view-section hidden">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4" data-i18n="title"></h1>
                <p class="text-lg text-gray-400 max-w-2xl mx-auto" data-i18n="subtitle"></p>
                <div class="mt-8 flex justify-center gap-4">
                    <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium text-gray-300"><i class="fas fa-folder-tree mr-2 text-novus-accent"></i><span id="cat-count"></span> <span data-i18n="categories"></span></div>
                    <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium text-gray-300"><i class="fas fa-globe mr-2 text-novus-accent"></i><span id="loc-count"></span> <span data-i18n="locales"></span></div>
                </div>
            </div>
            
            <div class="flex justify-center gap-6 mb-12">
                <button onclick="navigate('doc', 'license')" class="glass-panel hover:bg-white/5 text-gray-300 font-semibold py-2 px-6 rounded-lg transition-colors"><i class="fas fa-file-contract mr-2"></i> <span data-i18n="license"></span></button>
                <button onclick="navigate('doc', 'contributing')" class="glass-panel hover:bg-white/5 text-gray-300 font-semibold py-2 px-6 rounded-lg transition-colors"><i class="fas fa-hands-helping mr-2"></i> <span data-i18n="contributing"></span></button>
            </div>

            <h2 class="text-2xl font-bold mb-6 border-b border-white/10 pb-2" data-i18n="browse"></h2>
            <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: CATEGORY -->
        <div id="view-category" class="view-section hidden">
            <button onclick="navigate('home')" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            <div class="flex items-center gap-4 mb-10 pb-4 border-b border-white/10">
                <img id="cat-icon" src="" class="h-14 w-14 rounded-xl shadow-lg">
                <div>
                    <h2 id="cat-title" class="text-3xl font-bold"></h2>
                    <p id="cat-desc" class="text-gray-400 mt-1"></p>
                </div>
            </div>
            <h3 class="text-xl font-bold mb-6" data-i18n="avail"></h3>
            <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: GAME DOCS -->
        <div id="view-game" class="view-section hidden">
            <button id="btn-back-cat" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            
            <div class="glass-panel rounded-2xl p-8 mb-8">
                <div class="flex items-start md:items-center gap-6 flex-col md:flex-row">
                    <img id="game-icon" src="" class="h-24 w-24 rounded-2xl shadow-xl border border-white/10">
                    <div class="flex-grow">
                        <h2 id="game-title" class="text-3xl font-bold mb-2"></h2>
                        <p id="game-desc" class="text-gray-400"></p>
                    </div>
                    <a id="game-dl-btn" href="#" download class="bg-novus-accent hover:bg-novus-accentHover text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-novus-accent/20 flex items-center whitespace-nowrap">
                        <i class="fas fa-download mr-2"></i> <span data-i18n="configBtn"></span> (JSON)
                    </a>
                </div>
            </div>

            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2" data-i18n="ports"></h3>
                    <div class="overflow-x-auto rounded-xl border border-white/10">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-white/5 text-gray-300 text-sm">
                                <tr>
                                    <th class="p-4" data-i18n="portName"></th>
                                    <th class="p-4" data-i18n="default"></th>
                                    <th class="p-4" data-i18n="protocol"></th>
                                    <th class="p-4" data-i18n="desc"></th>
                                </tr>
                            </thead>
                            <tbody id="ports-tbody" class="text-sm divide-y divide-white/5 bg-black/20"></tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2" data-i18n="vars"></h3>
                    <div class="overflow-x-auto rounded-xl border border-white/10">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-white/5 text-gray-300 text-sm">
                                <tr>
                                    <th class="p-4" data-i18n="variable"></th>
                                    <th class="p-4" data-i18n="envKey"></th>
                                    <th class="p-4" data-i18n="default"></th>
                                    <th class="p-4" data-i18n="rules"></th>
                                </tr>
                            </thead>
                            <tbody id="vars-tbody" class="text-sm divide-y divide-white/5 bg-black/20"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: MARKDOWN DOCS -->
        <div id="view-doc" class="view-section hidden">
            <button onclick="navigate('home')" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            <div id="doc-content" class="glass-panel rounded-2xl p-8 markdown-body"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-auto bg-novus-900/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
            <p class="text-gray-300 font-semibold mb-1" data-i18n="footerCopyright"></p>
            <p class="text-gray-500 text-sm mb-4" data-i18n="footerDeveloped"></p>
            <p class="text-gray-600 text-xs max-w-3xl mx-auto" data-i18n="footerDisclaimer"></p>
        </div>
    </footer>

    <!-- Application Logic -->
    <script>
        const data = window.SITE_DATA;
        const stored = localStorage.getItem('novus_lang');
        const browser = navigator.language.slice(0,2);
        let currentLang = stored || (data.langs.includes(browser) ? browser : 'en');
        if (!data.langs.includes(currentLang)) currentLang = 'en';
        
        let currentView = 'home';
        let currentContext = null;

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('novus_lang', l);
            render();
        }

        function navigate(view, context = null) {
            currentView = view;
            currentContext = context;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        function render() {
            const ui = data.ui[currentLang] || data.ui.en;
            
            // Render UI Strings
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (ui[k]) el.innerHTML = ui[k];
            });

            // Render Lang Select
            const langSel = document.getElementById('lang-select');
            langSel.innerHTML = data.langs.map(l => `<option value="${l}" ${l === currentLang ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('');

            // View Management
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + currentView).classList.remove('hidden');

            if (currentView === 'home') {
                document.getElementById('cat-count').innerText = data.categories.length;
                document.getElementById('loc-count').innerText = data.langs.length;
                
                let html = '';
                data.categories.forEach(cat => {
                    const lCat = cat.locales[currentLang] || cat.locales.en;
                    html += `
                        <div class="glass-panel rounded-2xl p-6 game-card cursor-pointer flex flex-col justify-center h-full" onclick="navigate('category', '${cat.id}')">
                            <div class="flex items-center gap-4">
                                <img src="${cat.iconUrl}" class="h-16 w-16 rounded-xl shadow-md border border-white/5">
                                <div>
                                    <h3 class="text-xl font-bold">${lCat.name || cat.locales.en.name}</h3>
                                    <p class="text-sm text-gray-400 mt-1 line-clamp-2">${lCat.description || cat.locales.en.description}</p>
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('categories-grid').innerHTML = html;
            }
            else if (currentView === 'category') {
                const cat = data.categories.find(c => c.id === currentContext);
                const lCat = cat.locales[currentLang] || cat.locales.en;
                document.getElementById('cat-title').innerText = lCat.name || cat.locales.en.name;
                document.getElementById('cat-desc').innerText = lCat.description || cat.locales.en.description;
                document.getElementById('cat-icon').src = cat.iconUrl;

                let html = '';
                cat.games.forEach(game => {
                    const lGame = game.locales[currentLang] || game.locales.en;
                    html += `
                        <div class="glass-panel rounded-2xl p-6 game-card flex flex-col h-full cursor-pointer" onclick="navigate('game', {cat: '${cat.id}', game: '${game.id}'})">
                            <div class="flex items-start gap-4 mb-4">
                                <img src="${game.iconUrl}" class="h-14 w-14 rounded-xl shadow-md border border-white/5">
                                <div>
                                    <h3 class="text-lg font-bold leading-tight mb-1">${lGame.name || game.locales.en.name}</h3>
                                    <span class="text-[10px] font-bold uppercase tracking-wider bg-novus-accent/20 text-novus-accent px-2 py-0.5 rounded border border-novus-accent/20">JSON</span>
                                </div>
                            </div>
                            <p class="text-gray-400 text-sm flex-grow mb-6 line-clamp-3">${lGame.description || game.locales.en.description}</p>
                            <div class="flex gap-3 mt-auto">
                                <a href="${game.configUrl}" onclick="event.stopPropagation()" class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-center text-sm font-semibold py-2 px-3 rounded-lg transition-colors" download>
                                    <i class="fas fa-download mr-1"></i> ${ui.configBtn}
                                </a>
                                <button class="flex-1 bg-novus-accent/10 hover:bg-novus-accent/20 text-novus-accent border border-novus-accent/20 text-center text-sm font-semibold py-2 px-3 rounded-lg transition-colors">
                                    <i class="fas fa-book mr-1"></i> ${ui.docsBtn}
                                </button>
                            </div>
                        </div>`;
                });
                document.getElementById('games-grid').innerHTML = html;
            }
            else if (currentView === 'game') {
                const cat = data.categories.find(c => c.id === currentContext.cat);
                const game = cat.games.find(g => g.id === currentContext.game);
                const lGame = game.locales[currentLang] || game.locales.en;
                
                document.getElementById('btn-back-cat').onclick = () => navigate('category', cat.id);
                document.getElementById('game-title').innerText = lGame.name || game.locales.en.name;
                document.getElementById('game-desc').innerText = lGame.description || game.locales.en.description;
                document.getElementById('game-icon').src = game.iconUrl;
                document.getElementById('game-dl-btn').href = game.configUrl;

                let portsHtml = '';
                const ports = lGame.ports_config || game.locales.en.ports_config || {};
                const enPorts = game.locales.en.ports_config || {};
                Object.keys(enPorts).forEach(pk => {
                    const ep = enPorts[pk];
                    const p = ports[pk] || ep;
                    portsHtml += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="p-4 font-semibold">${p.name || ep.name}</td>
                            <td class="p-4"><code class="text-novus-accent bg-novus-accent/10 px-2 py-1 rounded">${ep.default_port}</code></td>
                            <td class="p-4"><span class="text-xs font-bold bg-white/10 px-2 py-1 rounded uppercase tracking-wider">${ep.protocol}</span></td>
                            <td class="p-4 text-gray-400">${p.description || ep.description}</td>
                        </tr>`;
                });
                document.getElementById('ports-tbody').innerHTML = portsHtml;

                let varsHtml = '';
                const lVars = lGame.variables || {};
                const enVars = game.locales.en.variables || [];
                enVars.forEach(ev => {
                    const lv = Array.isArray(lVars) ? lVars.find(v => v.env_variable === ev.env_variable) : lVars[ev.env_variable];
                    const vName = lv?.name || ev.name;
                    const vDesc = lv?.description || ev.description;
                    varsHtml += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="p-4">
                                <div class="font-semibold text-white">${vName}</div>
                                <div class="text-xs text-gray-500 mt-1">${vDesc}</div>
                            </td>
                            <td class="p-4"><code class="text-purple-400 bg-purple-400/10 px-2 py-1 rounded">${ev.env_variable}</code></td>
                            <td class="p-4"><code class="text-gray-300 bg-white/5 px-2 py-1 rounded">${ev.default_value || 'None'}</code></td>
                            <td class="p-4"><code class="text-yellow-400 bg-yellow-400/10 px-2 py-1 rounded text-xs">${ev.rules}</code></td>
                        </tr>`;
                });
                document.getElementById('vars-tbody').innerHTML = varsHtml;
            }
            else if (currentView === 'doc') {
                const md = data.docs[currentLang]?.[currentContext] || data.docs.en[currentContext] || '# Document not found';
                document.getElementById('doc-content').innerHTML = marked.parse(md);
            }
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>

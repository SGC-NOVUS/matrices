HER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE. \n","contributing":"# How to Contribute to NOVUS-OS Matrices\n\nYou can contribute by creating a new pull request or testing existing pull requests. Testing is very important and highly appreciated!\n\n## General Rules for Game Matrices\n\n- **Don't be afraid to submit PRs**. We welcome all contributions! Feel free to open a draft PR if your matrix isn't quite finished yet.\n- **Keep it secure**. Do not include start scripts that a user can easily exploit. If a complex start script is needed, it should be heavily sanitized.\n- **Keep it simple**. We don't need massive install scripts. Keep installation clean, optimized, and readable.\n- **Keep it small**. Only download what is absolutely needed. Use standardized NOVUS-OS core Docker images.\n- **Use Official NOVUS-OS Runtimes**. If you need a specific environment, use our official images. Self-hosted or undocumented third-party images will not be accepted for security reasons.\n- **Export from the Panel**. Please use the NOVUS-OS panel tools to manage and export your matrix JSON files. This ensures the structure remains strictly compliant.\n\n## Making a Pull Request\n\n1. **Test Your Matrix**: Make sure your install process is rock solid. We will test matrices before they are merged.\n2. **Make a Branch**: Please make a separate branch for your work (e.g., `feature/add-minecraft-bedrock`). Do not PR directly from your `main` branch.\n3. **Open a PR**: [Click here to open a Pull Request](https://github.com/SGC-NOVUS/matrices/compare). Ensure your English `.json` matrix is properly formatted. \n4. **AI Security Audit**: All Pull Requests are subject to an automated AI security audit. The AI will scan your matrix for malicious scripts, insecure containers, and compliance with our guidelines. A detailed report will be generated and sent to our team.\n5. **Localization  проекта не связаны с Valve Corporation или другими издателями игр. \n   Все упомянутые игровые активы, логотипы и товарные знаки принадлежат их законным владельцам.\n\n3. КОНТЕНТ, СГЕНЕРИРОВАННЫЙ ИИ (ЛОКАЛИЗАЦИИ):\n   Локализации, описания и структурные метаданные в этом репозитории \n   создаются автоматически с использованием API Google Gemini AI. Несмотря на применение строгих \n   процессов сборки, переводы могут содержать технические или контекстуальные неточности. \n   Пользователи применяют эти конфигурации на свой собственный операционный риск.\n\n--------------------------------------------------------------------------------\nПРОГРАММНОЕ ОБЕСПЕЧЕНИЕ ПРЕДОСТАВЛЯЕТСЯ «КАК ЕСТЬ», БЕЗ КАКИХ-ЛИБО ГАРАНТИЙ, ЯВНЫХ ИЛИ\nПОДРАЗУМЕВАЕМЫХ, ВКЛЮЧАЯ, НО НЕ ОГРАНИЧИВАЯСЬ ГАРАНТИЯМИ ТОВАРНОЙ ПРИГОДНОСТИ,\nСООТВЕТСТВИЯ КОНКРЕТНОМУ НАЗНАЧЕНИЮ И НЕНАРУШЕНИЯ ПРАВ. НИ В КОЕМ СЛУЧАЕ АВТОРЫ\nИЛИ ПРАВООБЛАДАТЕЛИ НЕ НЕСУТ ОТВЕТСТВЕННОСТИ ПО КАКИМ-ЛИБО ИСКАМ, ЗА УЩЕРБ ИЛИ ПО ИНЫМ\nТРЕБОВАНИЯМ, В ТОМ ЧИСЛЕ ПРИ ДЕЙСТВИИ КОНТРАКТА, ДЕЛИКТЕ ИЛИ ИНОЙ СИТУАЦИИ, ВОЗНИКАЮЩИМ ИЗ,\nВ РЕЗУЛЬТАТЕ ИЛИ В СВЯЗИ С ПРОГРАММНЫМ ОБЕСПЕЧЕНИЕМ ЛИБО ИСПОЛЬЗОВАНИЕМ ПРОГРАММНОГО ОБЕСПЕЧЕНИЯ\nИЛИ ИНЫМИ ДЕЙСТВИЯМИ С ПРОГРАММНЫМ ОБЕСПЕЧЕНИЕМ.","contributing":"# Как внести свой вклад в матрицы NOVUS-OS\n\nВы можете внести свой вклад, создав новый пул-реквест (pull request) или протестировав существующие. Тестирование очень важно и высоко ценится!\n\n## Общие правила для игровых матриц\n\n- **Не бойтесь отправлять PR**. Мы приветствуем любые вклады! Не стесняйтесь открывать PR в статусе черновика (draft), если ваша матрица еще не совсем готова.\n- **Соблюдайте безопасность**. Не включайте стартовые скрипты, которые пользователь может легко взломать. Если необходим сложный стартовый скрипт, он должен быть тщательно очищен и проверен.\n- **Держите всё проще**. Нам не нужны огромные скрипты установки. Установка должна быть чистой, оптимизированной и легко читаемой.\n- **Минимизируйте размер**. Загружайте только то, что абсолютно необходимо. Используйте стандартизированные базовые Docker-образы NOVUS-OS.\n- **Используйте официальные среды выполнения NOVUS-OS**. Если вам нужна определенная среда, используйте наши официальные образы. Собственные или не задокументированные сторонние образы не будут приняты по соображениям безопасности.\n- **Экспортируйте из панели**. Пожалуйста, используйте инструменты панели NOVUS-OS для управления и экспорта файлов JSON ваших матриц. Это гарантирует строгое соответствие структуры.\n\n## Создание пул-реквеста\n\n1. **Протестируйте свою матрицу**: Убедитесь, что процесс установки работает безупречно. Мы будем тестировать матрицы перед их слиянием.\n2. **Создайте ветку**: Пожалуйста, создайте отдельную ветку для своей работы (например, `feature/add-minecraft-bedrock`). Не отправляйте PR напрямую из вашей ветки `main`.\n3. **Откройте PR**: [Нажмите здесь, чтобы открыть пул-реквест](https://github.com/SGC-NOVUS/matrices/compare). Убедитесь, что ваша матрица на английском языке в формате `.json` правильно отформатирована. \n4. **ИИ-аудит безопасности**: Все пул-реквесты подлежат автоматическому аудиту безопасности с помощью ИИ. ИИ просканирует вашу матрицу на наличие вредоносных скриптов, небезопасных контейнеров и соответствие нашим рекомендациям. Будет сгенерирован подробный отчет и отправлен нашей команде.\n5. **Локализация происходит автоматически**: Вам НЕ нужно переводить свою матрицу. Просто предоставьте JSON на английском языке, и компилятор NOVUS-OS автоматически переведет вашу матрицу на все поддерживаемые языки с помощью Gemini AI при слиянии!\n\n---\n\n## Обратная связь и поддержка\n\nЕсть идеи по улучшению или нашли проблему? Мы всегда открыты для предложений!\n- **Электронная почта:** contribute@sgc-novus.fun"},"uk":{"license":"MIT License\n\nCopyright (c) 2026 SGC-NOVUS та Учасники <support@sgc-novus.fun>\n\nЦим ліцензією безоплатно надається дозвіл будь-якій особі, яка отримує копію\nцього програмного забезпечення та супутньої документації (далі — «Програмне забезпечення»),\nвикористовувати Програмне забезпечення без обмежень, включаючи право на використання,\nкопіювання, модифікацію, злиття, публікацію, поширення, субліцензування та/або продаж\nкопій Програмного забезпечення, а також дозволяти особам, яким надається Програмне забезпечення,\nробити це за таких умов:\n\nВищенаведене повідомлення про авторські права та цей дозвіл мають бути включені в усі\nкопії або суттєві частини Програмного забезпечення.\n\n--------------------------------------------------------------------------------\nДОДАТКОВІ УМОВИ, ПОЛОЖЕННЯ ТА ВІДМОВИ ВІД ВІДПОВІДАЛЬНОСТІ:\n\n1. ОБМЕЖЕННЯ ЩОДО ТОРГОВЕЛЬНИХ МАРОК ТА БРЕНДИНГУ:\n   Ця ліцензія НЕ надає вам жодних прав на використання товарних знаків, комерційних назв,\n   логотипів або знаків обслуговування «SGC-NOVUS» або «NOVUS-OS» у будь-який спосіб, що вказує на\n   офіційне схвалення, спонсорство або авторство з боку оригінальних творців.\n   Модифіковані дистрибутиви, що використовують ці матриці, повинні змінити брендинг, щоб уникнути плутанини у користувачів.\n\n2. АКТИВИ ТА ЗАЛЕЖНОСТІ ТРЕТІХ СТОРІН:\n   Цей репозиторій містить конфігурації ігрових серверів, матриці та метадані,\n   призначені для взаємодії зі SteamCMD, інфраструктурою Valve та сторонніми API.\n   Творці проєкту не пов'язані з Valve Corporation чи іншими видавцями ігор.\n   Усі згадані ігрові активи, логотипи та торговельні марки належать їхнім відповідним власникам.\n\n3. ЗМІСТ, ЗГЕНЕРОВАНИЙ ШТУЧНИМ ІНТЕЛЕКТОМ (ЛОКАЛІЗАЦІЇ):\n   Локалізації, описи та структурні метадані в цьому репозиторії\n   автоматично синтезуються за допомогою API штучного інтелекту Google Gemini. Попри застосування\n   суворих конвеєрів збірки, переклади можуть містити технічні або контекстні неточності.\n   Користувачі впроваджують ці конфігурації на свій власний експлуатаційний ризик.\n\n--------------------------------------------------------------------------------\nПРОГРАМНЕ ЗАБЕЗПЕЧЕННЯ НАДАЄТЬСЯ «ЯК Є», БЕЗ ЖОДНИХ ГАРАНТІЙ, ЯВНИХ АБО\nПОБУДЖЕНИХ, ВКЛЮЧАЮЧИ, АЛЕ НЕ ОБМЕЖУЮЧИСЬ ГАРАНТІЯМИ ТОВАРНОЇ ПРИДАТНОСТІ,\nПРИДАТНОСТІ ДЛЯ ПЕВНОЇ МЕТИ ТА ВІДСУТНОСТІ ПОРУШЕНЬ ПРАВ. АВТОРИ АБО ВЛАСНИКИ АВТОРСЬКИХ ПРАВ\nУ ЖОДНОМУ РАЗІ НЕ НЕСУТЬ ВІДПОВІДАЛЬНОСТІ ЗА БУДЬ-ЯКІ ПОЗОВИ, ЗБИТКИ АБО ІНШУ\nВІДПОВІДАЛЬНІСТЬ, ЧИ то в РАМКАХ ДОГОВОРУ, ДІЯННЯ ЗА ЗАКОНОМ (ВКЛЮЧАЮЧИ РЕЧЕВЕ ПРАВО), АБО ІНШОМ,\nЩО ВИНИКАЄ З, ВИПЛИВАЄ АБО ПОВ'ЯЗАНИЙ З ПРОГРАМНИМ ЗАБЕЗПЕЧЕННЯМ АБО ВИКОРИСТАННЯМ\nЧИ ІНШИМИ ДІЯМИ З ПРОГРАМНИМ ЗАБЕЗПЕЧЕННЯМ.","contributing":"# Як долучитися до розробки матриць NOVUS-OS\n\nВи можете зробити свій внесок, створивши новий запит на злиття (pull request) або протестувавши існуючі. Тестування є дуже важливим і високо цінується!\n\n## Загальні правила для ігрових матриць\n\n- **Не бійтеся надсилати PR**. Ми вітаємо будь-хто внесок! Не соромтеся відкривати чорновий PR (draft PR), якщо ваша матриця ще не зовсім готова.\n- **Дбайте про безпеку**. Не включайте стартові скрипти, які користувач може легко використати зловмисно. Якщо потрібен складний стартовий скрипт, він має бути ретельно очищений.\n- **Тримайте все простим**. Нам не потрібні величезні скрипти встановлення. Зберігайте процес встановлення чистим, оптимізованим та читабельним.\n- **Тримайте все компактним**. Завантажуйте лише те, що дійсно необхідно. Використовуйте стандартні базові Docker-образи NOVUS-OS.\n- **Використовуйте офіційні середовища виконання NOVUS-OS**. Якщо вам потрібне певне середовище, використовуйте наші офіційні образи. Власні або не задокументовані сторонні образи не прийматимуться з міркувань безпеки.\n- **Експортуйте з панелі**. Будь ласка, використовуйте інструменти панелі NOVUS-OS для керування та експорту файлів JSON вашої матриці. Це гарантує сувору відповідність структури вимогам.\n\n## Створення запиту на злиття (Pull Request)\n\n1. **Протестуйте свою матрицю**: Переконайтеся, що процес встановлення працює ідеально. Ми тестуватимемо матриці перед їх злиттям.\n2. **Створіть гілку**: Будь ласка, створіть окрему гілку для своєї роботи (наприклад, `feature/add-minecraft-bedrock`). Не робіть PR безпосередньо з вашої гілки `main`.\n3. **Відкрийте PR**: [Клацніть тут, щоб відкрити запит на злиття](https://github.com/SGC-NOVUS/matrices/compare). Переконайтеся, що ваша матриця у форматі `.json` англійською мовою правильно відформатована. \n4. **Аудит безпеки за допомогою штучного інтелекту**: Усі запити на злиття проходять автоматизований аудит безпеки за допомогою ШІ. ШІ просканує вашу матрицю на наявність шкідливих скриптів, небезпечних контейнерів та дотримання наших інструкцій. Буде створено детальний звіт, який надійде нашій команді.\n5. **Локалізація відбувається автоматично**: Вам НЕ потрібно перекладати вашу матрицю. Просто надайте JSON англійською мовою, і компілятор NOVUS-OS автоматично перекладе вашу матрицю на всі підтримувані мови за допомогою Gemini AI, коли ми її об'єднаємо!\n\n---\n\n## Зворотний зв'язок та підтримка\n\nМаєте ідеї щодо покращення чи знайшли проблему? Ми завжди відкриті до пропозицій!\n- **Електронна пошта:** contribute@sgc-novus.fun"}},"categories":[{"id":"steamcmd-source","iconUrl":"https://hub.sgc-novus.fun/steamcmd-source/steamcmd_source.webp","fallbackIconUrl":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/steamcmd_source.webp","locales":{"en":{"name":"SteamCMD Servers","description":"Official game servers running on Source engine and SteamCMD architecture."},"ru":{"name":"Серверы SteamCMD","description":"Официальные игровые серверы, работающие на движке Source и архитектуре SteamCMD."},"uk":{"name":"Сервери SteamCMD","description":"Офіційні ігрові сервери, що працюють на движку Source та архітектурі SteamCMD."}},"games":[{"id":"garrys_mod","iconUrl":"https://hub.sgc-novus.fun/steamcmd-source/Garry%60s%20mod/garrys_mod.webp","fallbackIconUrl":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/Garry%60s%20mod/garrys_mod.webp","configUrl":"https://hub.sgc-novus.fun/steamcmd-source/Garry%60s%20mod/garrys_mod.json","fallbackConfigUrl":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/Garry%60s%20mod/garrys_mod.json","filename":"garrys_mod.json","locales":{"en":{"version":"1.0.0","name":"Garry's Mod","description":"Garry's Mod is a definitive physics sandbox powered by the Source engine. It offers ultimate freedom with no predefined goals — spawn props, build complex contraptions, and install thousands of community addons.","author":"SGC-NOVUS Tech","icon_url":"https://hub.sgc-novus.fun/steamcmd-source/Garry%60s%20mod/garrys_mod.webp","type":"game","slug":"GMOD","run_image":"ghcr.io/sgc-novus/core-images:source","install_image":"ghcr.io/sgc-novus/core-images:source","data_dir":"/home/container","startup_command":"$( [ \"$SERVER_ARCH\" == \"64\" ] && printf %s './srcds_linux64' || printf %s './srcds_run' ) -game garrysmod -console -port {{SERVER_PORT}} +ip 0.0.0.0 +map {{SRCDS_MAP}} +gamemode {{GAMEMODE}} -strictportbind -norestart +maxplayers {{MAX_PLAYERS}} -tickrate {{TICKRATE}} $( [ \"$LUA_REFRESH\" == \"1\" ] || printf %s '-disableluarefresh' ) +hostname \"{{SERVER_HOSTNAME}}\" +sv_region {{SV_REGION}} +sv_location \"{{SV_LOCATION}}\" $( [ -n \"$WORKSHOP_ID\" ] && printf %s \"+host_workshop_collection $WORKSHOP_ID\" ) $( [ -n \"$STEAM_API\" ] && printf %s \"-authkey $STEAM_API\" ) $( [ -n \"$STEAM_GSLT\" ] && printf %s \"+sv_setsteamaccount $STEAM_GSLT\" ) $( [ -n \"$SERVER_PASSWORD\" ] && printf %s \"+sv_password \\\"$SERVER_PASSWORD\\\"\" ) $( [ -n \"$RCON_PASSWORD\" ] && printf %s \"+rcon_password \\\"$RCON_PASSWORD\\\"\" ) $( [ -n \"$SV_TAGS\" ] && printf %s \"+sv_tags \\\"$SV_TAGS\\\"\" ) $( [ -n \"$SV_LOADINGURL\" ] && printf %s \"+sv_loadingurl \\\"$SV_LOADINGURL\\\"\" ) $( [ -n \"$SV_DOWNLOADURL\" ] && printf %s \"+sv_downloadurl \\\"$SV_DOWNLOADURL\\\"\" )","stop_command":"quit","install_script":"#!/bin/bash\nif [ \"${STEAM_USER}\" == \"\" ]; then\n    STEAM_USER=anonymous\n    STEAM_PASS=\"\"\n    STEAM_AUTH=\"\"\nfi\n\ncd /tmp\nmkdir -p /home/container/steamcmd\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\ntar -xzvf steamcmd.tar.gz -C /home/container/steamcmd\nmkdir -p /home/container/steamapps\ncd /home/container/steamcmd\n\nchown -R root:root /home/container\nexport HOME=/home/container\n\nBETA_FLAG=\"\"\nif [ \"${SERVER_ARCH}\" == \"64\" ]; then\n    BETA_FLAG=\"-beta x86-64\"\nfi\n\n./steamcmd.sh +force_install_dir /home/container +login ${STEAM_USER:-anonymous} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' || printf %s '+@sSteamCmdForcePlatformType linux' ) +app_update ${SRCDS_APPID:-4020} ${BETA_FLAG} ${EXTRA_FLAGS} validate +quit\n\nmkdir -p /home/container/.steam/sdk32\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\nmkdir -p /home/container/.steam/sdk64\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so || true\n\nmkdir -p /home/container/garrysmod/lua/bin\ncd /home/container\n\nLATEST_MYSQLOO_32=$(curl -s https://api.github.com/repos/FredyH/MySQLOO/releases/latest | jq -r '.assets[] | select(.name == \"gmsv_mysqloo_linux.dll\") | .browser_download_url')\nif [ -n \"$LATEST_MYSQLOO_32\" ] && [ \"$LATEST_MYSQLOO_32\" != \"null\" ]; then\n    curl -sL \"$LATEST_MYSQLOO_32\" -o /home/container/garrysmod/lua/bin/gmsv_mysqloo_linux.dll\nfi\n\nLATEST_MYSQLOO_64=$(curl -s https://api.github.com/repos/FredyH/MySQLOO/releases/latest | jq -r '.assets[] | select(.name == \"gmsv_mysqloo_linux64.dll\") | .browser_download_url')\nif [ -n \"$LATEST_MYSQLOO_64\" ] && [ \"$LATEST_MYSQLOO_64\" != \"null\" ]; then\n    curl -sL \"$LATEST_MYSQLOO_64\" -o /home/container/garrysmod/lua/bin/gmsv_mysqloo_linux64.dll\nfi\n\ncd /home/container/garrysmod/lua/autorun/server\necho '-- Docs: https://wiki.garrysmod.com/page/resource/AddWorkshop\nresource.AddWorkshop( \"\" )' > workshop.lua\n\ncd /home/container/garrysmod/cfg\necho '// Please do not set RCon, Hostname, Password, Region, Location or URLs in here; use the startup parameters in panel.\n\nsv_lan \"0\"\nsv_max_queries_sec_global \"30000\"\nsv_max_queries_window \"45\"\nsv_max_queries_sec \"5\"\n\nsbox_maxprops       100\nsbox_maxragdolls    5\nsbox_maxnpcs        10\nsbox_maxballoons    10\nsbox_maxeffects     10\nsbox_maxdynamite    10\nsbox_maxlamps       10\nsbox_maxthrusters   10\nsbox_maxwheels      10\nsbox_maxhoverballs  10\nsbox_maxvehicles    20\nsbox_maxbuttons     10\nsbox_maxsents       20\nsbox_maxemitters    5\nsbox_godmode        0\nsbox_noclip         0\n\nsv_minrate          75000\nsv_maxrate          0\ngmod_physiterations 2\nnet_splitpacket_maxrate 45000\ndecalfrequency      12\n\nexec banned_ip.cfg\nexec banned_user.cfg' > server.cfg","ports_config":{"client":{"name":"Client Port","default_port":27005,"protocol":"udp","env_variable":"CLIENT_PORT","description":"The primary port utilized by game clients to establish connections with your server."},"primary":{"name":"Primary Port","default_port":27015,"protocol":"tcp+udp","env_variable":"SERVER_PORT","description":"The core server port responsible for general connections, queries, and RCON administration."},"reserve":{"name":"Reserve Port","default_port":27016,"protocol":"tcp+udp","env_variable":"SERVER_PORT_RESERVE","description":"A secondary fallback port automatically allocated if the primary port encounters binding conflicts."},"sourcetv":{"name":"SourceTV Port","default_port":27025,"protocol":"udp","env_variable":"SOURCETV_PORT","description":"The broadcast port dedicated to SourceTV spectator streaming and match recording."}},"variables":[{"name":"Server Architecture","description":"Select the binary architecture for the game engine. We strongly recommend the '64' (x86-64) branch for production servers to bypass the legacy 4GB RAM limit and drastically improve performance. Use '32' only if specific legacy addons require it.","env_variable":"SERVER_ARCH","default_value":"64","user_viewable":true,"user_editable":true,"rules":"required|integer|in:32,64","ui_group":"general"},{"name":"Server Hostname","description":"The public display name of your server in the Steam server browser. Note: The Source engine strictly truncates hostnames exceeding 63 characters. Keep it concise and impactful.","env_variable":"SERVER_HOSTNAME","default_value":"New NOVUS Gmod Server","user_viewable":true,"user_editable":true,"rules":"required|string|max:63","ui_group":"general"},{"name":"Server Tags","description":"Comma-separated keywords to optimize your server's visibility in the in-game search engine (e.g., 'sandbox,rp,wiremod'). Spaces are strictly prohibited. Supports multiple languages.","env_variable":"SV_TAGS","default_value":"sandbox,build,wiremod","user_viewable":true,"user_editable":true,"rules":"nullable|string|max:255|regex:/^[^,\\s]+(,[^,\\s]+)*$/u","ui_group":"general"},{"name":"Server Password","description":"The authentication password required for players to join. Leave this field completely empty to operate a public server accessible to everyone.","env_variable":"SERVER_PASSWORD","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|max:64","ui_group":"security"},{"name":"RCON Password","description":"The cryptographic passphrase used for remote console (RCON) administration. For maximum security, leave this empty to permanently disable RCON if you manage permissions via in-game mods (like ULX/SAM/NovusAdmin).","env_variable":"RCON_PASSWORD","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|max:64","ui_group":"security"},{"name":"Steam Region","description":"Designates the geographic region for Steam master server routing. This affects how your server is categorized in the global browser (e.g., 0=US East, 1=US West, 2=South America, 3=Europe, 4=Asia, 5=Australia, 6=Middle East, 7=Africa, 255=World).","env_variable":"SV_REGION","default_value":"255","user_viewable":true,"user_editable":true,"type":"select","options_source":"steam_regions","rules":"required|integer|min:0|max:255","ui_group":"general"},{"name":"Server Location","description":"The two-letter ISO 3166-1 alpha-2 country code (e.g., 'US', 'DE', 'UA') used to display the correct national flag next to your server. Defaults to 'XX' for International.","env_variable":"SV_LOCATION","default_value":"XX","user_viewable":true,"user_editable":true,"type":"select","options_source":"countries_iso2","rules":"required|string|size:2|alpha","ui_group":"general"},{"name":"Loading Screen URL","description":"A custom HTTP/HTTPS web endpoint displayed while players connect. You can inject dynamic variables like '%s' (Player SteamID64) and '%m' (Current Map) to personalize the loading experience.","env_variable":"SV_LOADINGURL","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|url|max:255","ui_group":"gameplay"},{"name":"FastDL URL","description":"The HTTP/HTTPS FastDL (Fast Download) endpoint. Drastically accelerates custom content (models, materials, sounds) delivery to clients by bypassing the slow native Source engine transfers.","env_variable":"SV_DOWNLOADURL","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|url|max:255","ui_group":"security"},{"name":"Map","description":"The initial map loaded upon server startup (e.g., 'gm_flatgrass', 'rp_downtown_v4c_v2'). Ensure the respective map file is either mounted via the Steam Workshop or physically present in your 'garrysmod/maps/' directory.","env_variable":"SRCDS_MAP","default_value":"gm_flatgrass","user_viewable":true,"user_editable":true,"rules":"required|string|alpha_dash|max:128","ui_group":"gameplay"},{"name":"Steam Account Token (GSLT)","description":"Your Game Server Login Token (GSLT). Mandatory for anonymous players to connect and for proper Steam ranking. Generate this at: https://steamcommunity.com/dev/managegameservers (Use AppID 4000).","env_variable":"S HTTPS FastDL (швидке завантаження). Значно прискорює доставку користувацького контенту (моделей, матеріалів, звуків) клієнтам шляхом обходу повільної нативної передачі даних рушія Source."},"SRCDS_MAP":{"name":"Мапа","description":"Початкова мапа, яка завантажується при запуску сервера (наприклад, 'gm_flatgrass', 'rp_downtown_v4c_v2'). Переконайтеся, що відповідний файл мапи змонтовано через майстерню Steam або він фізично присутній у вашій директорії 'garrysmod/maps/'."},"STEAM_GSLT":{"name":"Токен акаунта Steam (GSLT)","description":"Ваш токен для входу на ігровий сервер (GSLT). Обов'язковий для підключення анонімних гравців та для правильного рейтингу Steam. Згенеруйте його на: https://steamcommunity.com/dev/managegameservers (Використовуйте AppID 4000)."},"GAME_APPID":{"name":"AppID гри (Клієнт)","description":"AppID 4000 — це ідентифікатор клієнта Garry's Mod. Безпечно використовується внутрішніми автогенераторами панелі. Не змінюйте."},"SRCDS_APPID":{"name":"AppID Source (Сервер)","description":"AppID 4020 використовується SteamCMD для завантаження необхідних файлів сервера. Не змінюйте."},"WORKSHOP_ID":{"name":"ID Workshop","description":"Числовий ID вашої публічної колекції Steam Workshop. Сервер автоматично синхронізує та встановить усі аддони з цієї колекції під час завантаження. Скопіюйте цифри з кінця URL-адреси вашої колекції."},"GAMEMODE":{"name":"Ігровий режим (Gamemode)","description":"Базовий ігровий режим, що завантажується рушієм. Повинний точно відповідати назві папки ігрового режиму в 'garrysmod/gamemodes/' (наприклад, 'sandbox', 'darkrp', 'terrortown')."},"MAX_PLAYERS":{"name":"Максимум гравців","description":"Абсолютна максимальна кількість слотів для гравців одночасно. Зважайте на можливості свого обладнання; фізика в Garry's Mod дуже сильно навантажує CPU. Жорстке обмеження, закладене рушієм, становить 128."},"TICKRATE":{"name":"Tickrate","description":"Частота симуляції (тактів за секунду) сервера. 33 — це оптимальний золотий стандарт для Garry's Mod. Вищі значення експоненціально збільшують навантаження на CPU та використання пропускної здатності мережі."},"LUA_REFRESH":{"name":"Оновлення Lua","description":"Вмикає або вимикає підсистему автооновлення для скриптів Lua. Увімкніть (1) для активної розробки. У робочому середовищі встановіть значення вимкнено (0), щоб уникнути фонового опитування диска I/O та зберегти ресурси сервера."},"SV_TAGS":{"name":"Теги сервера","description":"Ключові слова, розділені комами, для оптимізації видимості вашого сервера в ігровій пошуковій системі (наприклад, 'sandbox,rp,wiremod'). Пробіли суворо заборонені. Підтримуються кілька мов."},"SERVER_ARCH":{"name":"Архітектура сервера","description":"Виберіть бінарну архітектуру для ігрового рушія. Ми наполегливо рекомендуємо гілку '64' (x86-64) для продуктивних серверів, щоб обійти застаріле обмеження в 4 ГБ оперативної пам'яті та значно покращити продуктивність. Використовуйте '32' лише тоді, коли цього вимагають певні застарілі аддони."}},"ports_config":{"client":{"name":"Клієнтський порт","description":"Основний порт, який використовується ігровими клієнтами для встановлення з'єднання з вашим сервером."},"primary":{"name":"Первинний порт","description":"Основний порт сервера, відповідальний за загальні з'єднання, запити та RCON-адміністрування."},"reserve":{"name":"Резервний порт","description":"Додатковий резервний порт, який автоматично виділяється, якщо основний порт стикається з конфліктами прив'язки."},"sourcetv":{"name":"Порт SourceTV","description":"Порт трансляції, призначений для перегляду глядачами SourceTV та запису матчів."}},"name":"Garry's Mod","description":"Garry's Mod — це неперевершена пісочниця з фізики на базі рушія Source. Вона пропонує повну свободу без попередньо визначених цілей — створюйте об'єкти, збирайте складні механізми та встановлюйте тисячі модифікацій від спільноти."}}}]}]};

        function applyImageFallbacks() {
            document.querySelectorAll('img.lazy-fallback').forEach(img => {
                if (img.dataset.initialized) return;
                img.dataset.initialized = "true";
                const primary = img.dataset.primary;
                const fallback = img.dataset.fallback;
                let fallbackTriggered = false;
                const triggerFallback = () => {
                    if (!fallbackTriggered) {
                        fallbackTriggered = true;
                        img.src = fallback;
                    }
                };
                img.onerror = triggerFallback;
                img.src = primary;
                setTimeout(() => {
                    if (!img.complete && !fallbackTriggered) {
                        triggerFallback();
                    }
                }, 2500);
            });
        }

        async function downloadConfig(e, primary, fallback, filename) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            const btn = e.currentTarget || e.target;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>';
            btn.style.pointerEvents = 'none';
            
            let urlToDownload = primary;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);
                const res = await fetch(primary, { signal: controller.signal, method: 'HEAD' });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error('Status ' + res.status);
            } catch (err) {
                console.warn('Primary download unavailable, using fallback.', err);
                urlToDownload = fallback;
            }
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = urlToDownload;
            a.download = filename || 'config.json';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            btn.innerHTML = originalHtml;
            btn.style.pointerEvents = 'auto';
        }
    </script>

        .game-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.2); border-color: rgba(14, 165, 233, 0.4); }
        .bg-glow { position: fixed; top: -150px; left: 50%; transform: translateX(-50%); width: 800px; height: 400px; background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(11,17,32,0) 70%); z-index: -1; pointer-events: none; }
        .markdown-body h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; }
        .markdown-body p { margin-bottom: 1rem; color: #9ca3af; line-height: 1.6; }
        .markdown-body a { color: #0EA5E9; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #9ca3af; }
        .markdown-body code { background: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; }
        .markdown-body pre code { display: block; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">
    <div class="bg-glow"></div>
    
    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-50 w-full border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                    <img src="https://github.com/SGC-NOVUS.png" alt="SGC-NOVUS" class="h-8 w-8 rounded-md">
                    <span class="font-bold text-xl tracking-tight">NOVUS-OS <span class="text-novus-accent">Matrices</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <select id="lang-select" onchange="setLang(this.value)" class="bg-novus-800 text-white text-sm rounded-lg focus:ring-novus-accent focus:border-novus-accent block px-2 py-1 outline-none border border-white/10 cursor-pointer">
                    </select>
                      <a href="https://github.com/SGC-NOVUS/matrices" class="text-gray-400 hover:text-white transition-colors"><i class="fab fa-github text-xl"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto py-6 w-full">
        <!-- Tabs Navigation -->
        <div class="px-4 sm:px-6 lg:px-8 mb-8 border-b border-white/5">
            <div class="flex space-x-8">
                <button onclick="switchTab('matrices')" id="tab-matrices" class="border-b-2 border-novus-accent text-white pb-4 px-1 text-sm font-medium transition-colors">
                    <span data-i18n="matricesTab">🎮 Game Server Matrices</span>
                </button>
                <button onclick="switchTab('runtimes')" id="tab-runtimes" class="border-b-2 border-transparent text-gray-400 hover:text-gray-300 hover:border-gray-300 pb-4 px-1 text-sm font-medium transition-colors">
                    <span data-i18n="runtimesTab">🐳 Official Docker Runtimes</span>
                </button>
            </div>
        </div>

        <div id="matrices-container" class="px-4 sm:px-6 lg:px-8">
        <!-- View: HOME -->
        <div id="view-home" class="view-section hidden">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4" data-i18n="title"></h1>
                <p class="text-lg text-gray-400 max-w-2xl mx-auto" data-i18n="subtitle"></p>
                <div class="mt-8 flex justify-center gap-4">
                    <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium text-gray-300"><i class="fas fa-folder-tree mr-2 text-novus-accent"></i><span id="cat-count"></span> <span data-i18n="categories"></span></div>
                    <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium text-gray-300"><i class="fas fa-globe mr-2 text-novus-accent"></i><span id="loc-count"></span> <span data-i18n="locales"></span></div>
                </div>
            </div>
            
            <div class="flex justify-center gap-6 mb-12">
                <button onclick="navigate('doc', 'license')" class="glass-panel hover:bg-white/5 text-gray-300 font-semibold py-2 px-6 rounded-lg transition-colors"><i class="fas fa-file-contract mr-2"></i> <span data-i18n="license"></span></button>
                <button onclick="navigate('doc', 'contributing')" class="glass-panel hover:bg-white/5 text-gray-300 font-semibold py-2 px-6 rounded-lg transition-colors"><i class="fas fa-hands-helping mr-2"></i> <span data-i18n="contributing"></span></button>
            </div>

            <h2 class="text-2xl font-bold mb-6 border-b border-white/10 pb-2" data-i18n="browse"></h2>
            <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: CATEGORY -->
        <div id="view-category" class="view-section hidden">
            <button onclick="navigate('home')" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            <div class="flex items-center gap-4 mb-10 pb-4 border-b border-white/10">
                <img id="cat-icon" src="" class="lazy-fallback h-14 w-14 rounded-xl shadow-lg">
                <div>
                    <h2 id="cat-title" class="text-3xl font-bold"></h2>
                    <p id="cat-desc" class="text-gray-400 mt-1"></p>
                </div>
            </div>
            <h3 class="text-xl font-bold mb-6" data-i18n="avail"></h3>
            <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: GAME DOCS -->
        <div id="view-game" class="view-section hidden">
            <button id="btn-back-cat" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            
            <div class="glass-panel rounded-2xl p-8 mb-8">
                <div class="flex items-start md:items-center gap-6 flex-col md:flex-row">
                    <img id="game-icon" src="" class="lazy-fallback h-24 w-24 rounded-2xl shadow-xl border border-white/10">
                    <div class="flex-grow">
                        <h2 id="game-title" class="text-3xl font-bold mb-2"></h2>
                        <p id="game-desc" class="text-gray-400"></p>
                    </div>
                    <a id="game-dl-btn" href="#" class="bg-novus-accent hover:bg-novus-accentHover text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-novus-accent/20 flex items-center whitespace-nowrap">
                        <i class="fas fa-download mr-2"></i> <span data-i18n="configBtn"></span> (JSON)
                    </a>
                </div>
            </div>

            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2" data-i18n="ports"></h3>
                    <div class="overflow-x-auto rounded-xl border border-white/10">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-white/5 text-gray-300 text-sm">
                                <tr>
                                    <th class="p-4" data-i18n="portName"></th>
                                    <th class="p-4" data-i18n="default"></th>
                                    <th class="p-4" data-i18n="protocol"></th>
                                    <th class="p-4" data-i18n="desc"></th>
                                </tr>
                            </thead>
                            <tbody id="ports-tbody" class="text-sm divide-y divide-white/5 bg-black/20"></tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2" data-i18n="vars"></h3>
                    <div class="overflow-x-auto rounded-xl border border-white/10">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-white/5 text-gray-300 text-sm">
                                <tr>
                                    <th class="p-4" data-i18n="variable"></th>
                                    <th class="p-4" data-i18n="envKey"></th>
                                    <th class="p-4" data-i18n="default"></th>
                                    <th class="p-4" data-i18n="rules"></th>
                                </tr>
                            </thead>
                            <tbody id="vars-tbody" class="text-sm divide-y divide-white/5 bg-black/20"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: MARKDOWN DOCS -->
        <div id="view-doc" class="view-section hidden">
            <button onclick="navigate('home')" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            <div id="doc-content" class="glass-panel rounded-2xl p-8 markdown-body"></div>
        </div>

        </div>
        
        <div id="runtimes-container" class="hidden px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4" data-i18n="runtimesTab">Official Docker Runtimes</h1>
                <p class="text-lg text-gray-400 max-w-2xl mx-auto" data-i18n="runtimesDesc">Optimized base images for game servers.</p>
            </div>
            <div id="runtimes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center col-span-full py-12 text-gray-500"><i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-novus-accent"></i><br>Loading Runtimes...</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-auto bg-novus-900/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
            <p class="text-gray-300 font-semibold mb-1" data-i18n="footerCopyright"></p>
            <p class="text-gray-500 text-sm mb-4" data-i18n="footerDeveloped"></p>
            <p class="text-gray-600 text-xs max-w-3xl mx-auto" data-i18n="footerDisclaimer"></p>
        </div>
    </footer>

    <!-- Application Logic -->
    <script>
        const data = window.SITE_DATA;
        const stored = localStorage.getItem('novus_lang');
        const browser = navigator.language.slice(0,2);
        let currentLang = stored || (data.langs.includes(browser) ? browser : 'en');
        if (!data.langs.includes(currentLang)) currentLang = 'en';
        
        let currentTab = 'matrices';
        let currentView = 'home';
        let currentContext = null;

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('novus_lang', l);
            render();
        }

        function navigate(view, context = null) {
            currentView = view;
            currentContext = context;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        function render() {
            const ui = data.ui[currentLang] || data.ui.en;
            
            // Render UI Strings
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (ui[k]) el.innerHTML = ui[k];
            });

            // Render Lang Select
            const langSel = document.getElementById('lang-select');
            langSel.innerHTML = data.langs.map(l => `<option value="${l}" ${l === currentLang ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('');

            // View Management
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + currentView).classList.remove('hidden');

            if (currentView === 'home') {
                document.getElementById('cat-count').innerText = data.categories.length;
                document.getElementById('loc-count').innerText = data.langs.length;
                
                let html = '';
                data.categories.forEach(cat => {
                    const lCat = cat.locales[currentLang] || cat.locales.en;
                    html += `
                        <div class="glass-panel rounded-2xl p-6 game-card cursor-pointer flex flex-col justify-center h-full" onclick="navigate('category', '${cat.id}')">
                            <div class="flex items-center gap-4">
                                <img data-primary="${cat.iconUrl}" data-fallback="${cat.fallbackIconUrl}" class="lazy-fallback h-16 w-16 rounded-xl shadow-md border border-white/5">
                                <div>
                                    <h3 class="text-xl font-bold">${lCat.name || cat.locales.en.name}</h3>
                                    <p class="text-sm text-gray-400 mt-1 line-clamp-2">${lCat.description || cat.locales.en.description}</p>
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('categories-grid').innerHTML = html;
            }
            else if (currentView === 'category') {
                const cat = data.categories.find(c => c.id === currentContext);
                const lCat = cat.locales[currentLang] || cat.locales.en;
                document.getElementById('cat-title').innerText = lCat.name || cat.locales.en.name;
                document.getElementById('cat-desc').innerText = lCat.description || cat.locales.en.description;
                const catIconEl = document.getElementById('cat-icon');
                catIconEl.dataset.primary = cat.iconUrl;
                catIconEl.dataset.fallback = cat.fallbackIconUrl;
                delete catIconEl.dataset.initialized;

                let html = '';
                cat.games.forEach(game => {
                    const lGame = game.locales[currentLang] || game.locales.en;
                    html += `
                        <div class="glass-panel rounded-2xl p-6 game-card flex flex-col h-full cursor-pointer" onclick="navigate('game', {cat: '${cat.id}', game: '${game.id}'})">
                            <div class="flex items-start gap-4 mb-4">
                                <img data-primary="${game.iconUrl}" data-fallback="${game.fallbackIconUrl}" class="lazy-fallback h-14 w-14 rounded-xl shadow-md border border-white/5">
                                <div>
                                    <h3 class="text-lg font-bold leading-tight mb-1">${lGame.name || game.locales.en.name}</h3>
                                    <span class="text-[10px] font-bold uppercase tracking-wider bg-novus-accent/20 text-novus-accent px-2 py-0.5 rounded border border-novus-accent/20">JSON</span>
                                </div>
                            </div>
                            <p class="text-gray-400 text-sm flex-grow mb-6 line-clamp-3">${lGame.description || game.locales.en.description}</p>
                            <div class="flex gap-3 mt-auto">
                                <a href="#" onclick="downloadConfig(event, '${game.configUrl}', '${game.fallbackConfigUrl}', '${game.filename}')" class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-center text-sm font-semibold py-2 px-3 rounded-lg transition-colors">
                                    <i class="fas fa-download mr-1"></i> ${ui.configBtn}
                                </a>
                                <button class="flex-1 bg-novus-accent/10 hover:bg-novus-accent/20 text-novus-accent border border-novus-accent/20 text-center text-sm font-semibold py-2 px-3 rounded-lg transition-colors">
                                    <i class="fas fa-book mr-1"></i> ${ui.docsBtn}
                                </button>
                            </div>
                        </div>`;
                });
                document.getElementById('games-grid').innerHTML = html;
            }
            else if (currentView === 'game') {
                const cat = data.categories.find(c => c.id === currentContext.cat);
                const game = cat.games.find(g => g.id === currentContext.game);
                const lGame = game.locales[currentLang] || game.locales.en;
                
                document.getElementById('btn-back-cat').onclick = () => navigate('category', cat.id);
                document.getElementById('game-title').innerText = lGame.name || game.locales.en.name;
                document.getElementById('game-desc').innerText = lGame.description || game.locales.en.description;
                const gameIconEl = document.getElementById('game-icon');
                gameIconEl.dataset.primary = game.iconUrl;
                gameIconEl.dataset.fallback = game.fallbackIconUrl;
                delete gameIconEl.dataset.initialized;
                document.getElementById('game-dl-btn').onclick = (e) => downloadConfig(e, game.configUrl, game.fallbackConfigUrl, game.filename);

                let portsHtml = '';
                const ports = lGame.ports_config || game.locales.en.ports_config || {};
                const enPorts = game.locales.en.ports_config || {};
                Object.keys(enPorts).forEach(pk => {
                    const ep = enPorts[pk];
                    const p = ports[pk] || ep;
                    portsHtml += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="p-4 font-semibold">${p.name || ep.name}</td>
                            <td class="p-4"><code class="text-novus-accent bg-novus-accent/10 px-2 py-1 rounded">${ep.default_port}</code></td>
                            <td class="p-4"><span class="text-xs font-bold bg-white/10 px-2 py-1 rounded uppercase tracking-wider">${ep.protocol}</span></td>
                            <td class="p-4 text-gray-400">${p.description || ep.description}</td>
                        </tr>`;
                });
                document.getElementById('ports-tbody').innerHTML = portsHtml;

                let varsHtml = '';
                const lVars = lGame.variables || {};
                const enVars = game.locales.en.variables || [];
                enVars.forEach(ev => {
                    const lv = Array.isArray(lVars) ? lVars.find(v => v.env_variable === ev.env_variable) : lVars[ev.env_variable];
                    const vName = lv?.name || ev.name;
                    const vDesc = lv?.description || ev.description;
                    varsHtml += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="p-4">
                                <div class="font-semibold text-white">${vName}</div>
                                <div class="text-xs text-gray-500 mt-1">${vDesc}</div>
                            </td>
                            <td class="p-4"><code class="text-purple-400 bg-purple-400/10 px-2 py-1 rounded">${ev.env_variable}</code></td>
                            <td class="p-4"><code class="text-gray-300 bg-white/5 px-2 py-1 rounded">${ev.default_value || 'None'}</code></td>
                            <td class="p-4"><code class="text-yellow-400 bg-yellow-400/10 px-2 py-1 rounded text-xs">${ev.rules}</code></td>
                        </tr>`;
                });
                document.getElementById('vars-tbody').innerHTML = varsHtml;
            }
            else if (currentView === 'doc') {
                const md = data.docs[currentLang]?.[currentContext] || data.docs.en[currentContext] || '# Document not found';
                document.getElementById('doc-content').innerHTML = marked.parse(md);
            }

            applyImageFallbacks();
            renderRuntimes();
        }

        let runtimesData = null;
        async function loadRuntimes() {
            if (runtimesData) return renderRuntimes();
            try {
                const res = await fetch('https://raw.githubusercontent.com/SGC-NOVUS/runtimes/main/runtimes.json');
                runtimesData = await res.json();
                renderRuntimes();
            } catch (e) {
                document.getElementById('runtimes-grid').innerHTML = '<div class="text-center col-span-full text-red-400">Failed to load runtimes from GitHub.</div>';
            }
        }

        function renderRuntimes() {
            if (!runtimesData || currentTab !== 'runtimes') return;
            let html = '';
            runtimesData.forEach(rt => {
                const locale = rt.locales[currentLang] || rt.locales.en || {};
                let componentsHtml = rt.components ? rt.components.map(c => `<span class="text-[10px] font-bold uppercase tracking-wider bg-white/10 text-gray-300 px-2 py-0.5 rounded">${c}</span>`).join(' ') : '';
                html += `
                    <div class="glass-panel rounded-2xl p-6 game-card flex flex-col h-full">
                        <div class="flex items-start gap-4 mb-4">
                            <img data-primary="${rt.iconUrl}" data-fallback="${rt.fallbackIconUrl}" class="lazy-fallback h-14 w-14 rounded-xl shadow-md border border-white/5 bg-white/5">
                            <div>
                                <h3 class="text-lg font-bold leading-tight mb-2">${locale.name || rt.id}</h3>
                                <div class="flex flex-wrap gap-1">${componentsHtml}</div>
                            </div>
                        </div>
                        <div class="text-gray-400 text-sm flex-grow mb-6 overflow-y-auto max-h-40 pr-2 whitespace-pre-wrap">${locale.description || ''}</div>
                        <div class="mt-auto">
                            <div class="bg-black/40 border border-white/10 rounded-lg flex items-center overflow-hidden">
                                <code class="px-3 py-2 text-[11px] text-gray-300 flex-grow font-mono truncate">${rt.pullCmd}</code>
                                <button onclick="copyDockerPull('${rt.pullCmd}', this)" class="bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white px-4 py-2 transition-colors border-l border-white/10 flex-shrink-0">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
            document.getElementById('runtimes-grid').innerHTML = html;
            applyImageFallbacks();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-matrices').className = tab === 'matrices' 
                ? 'border-b-2 border-novus-accent text-white pb-4 px-1 text-sm font-medium transition-colors' 
                : 'border-b-2 border-transparent text-gray-400 hover:text-gray-300 hover:border-gray-300 pb-4 px-1 text-sm font-medium transition-colors';
                
            document.getElementById('tab-runtimes').className = tab === 'runtimes' 
                ? 'border-b-2 border-novus-accent text-white pb-4 px-1 text-sm font-medium transition-colors' 
                : 'border-b-2 border-transparent text-gray-400 hover:text-gray-300 hover:border-gray-300 pb-4 px-1 text-sm font-medium transition-colors';
                
            if (tab === 'matrices') {
                document.getElementById('matrices-container').classList.remove('hidden');
                document.getElementById('runtimes-container').classList.add('hidden');
            } else {
                document.getElementById('matrices-container').classList.add('hidden');
                document.getElementById('runtimes-container').classList.remove('hidden');
                loadRuntimes();
            }
        }

        window.copyDockerPull = function(text, btn) {
            const originalHTML = btn.innerHTML;
            const successHTML = '<i class="fas fa-check text-green-400"></i>';
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    btn.innerHTML = successHTML;
                    setTimeout(() => btn.innerHTML = originalHTML, 2000);
                }).catch(() => fallbackCopy(text, btn, originalHTML, successHTML));
            } else {
                fallbackCopy(text, btn, originalHTML, successHTML);
            }
        };

        function fallbackCopy(text, btn, originalHTML, successHTML) {
            const el = document.createElement('textarea');
            el.value = text;
            el.style.position = 'fixed';
            el.style.opacity = '0';
            document.body.appendChild(el);
            el.select();
            try {
                document.execCommand('copy');
                btn.innerHTML = successHTML;
                setTimeout(() => btn.innerHTML = originalHTML, 2000);
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(el);
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            // Preload runtimes in background
            fetch('https://raw.githubusercontent.com/SGC-NOVUS/runtimes/main/runtimes.json')
                .then(r => r.json())
                .then(data => { runtimesData = data; })
                .catch(e => console.warn('Failed to preload runtimes'));
        });
    </script>
</body>
</html>

. If a complex start script is needed, it should be heavily sanitized.\n- **Keep it simple**. We don't need massive install scripts. Keep installation clean, optimized, and readable.\n- **Keep it small**. Only download what is absolutely needed. Use standardized NOVUS-OS core Docker images.\n- **Use Official NOVUS-OS Runtimes**. If you need a specific environment, use our official images. Self-hosted or undocumented third-party images will not be accepted for security reasons.\n- **Export from the Panel**. Please use the NOVUS-OS panel tools to manage and export your matrix JSON files. This ensures the structure remains strictly compliant.\n\n## Making a Pull Request\n\n1. **Test Your Matrix**: Make sure your install process is rock solid. We will test matrices before they are merged.\n2. **Make a Branch**: Please make a separate branch for your work (e.g., `feature/add-minecraft-bedrock`). Do not PR directly from your `main` branch.\n3. **Open a PR**: [Click here to open a Pull Request](https://github.com/SGC-NOVUS/matrices/compare). Ensure your English `.json` matrix is properly formatted. \n4. **AI Security Audit**: All Pull Requests are subject to an automated AI security audit. The AI will scan your matrix for malicious scripts, insecure containers, and compliance with our guidelines. A detailed report will be generated and sent to our team.\n5. **Localization is Automatic**: You DO NOT need to translate your matrix. Simply provide the English JSON, and the NOVUS-OS Compiler will automatically translate your matrix into all supported languages using Gemini AI when we merge it!\n\n---\n\n## Feedback & Support\n\nHave ideas for improvement or found an issue? We are always open to suggestions!\n- **Email:** contribute@sgc-novus.fun \n"},"ru":{"license":"{\n  \"translation\": \"Лицензия MIT\\n\\nCopyright (c) 2026 SGC-NOVUS и Участники <support@sgc-novus.fun>\\n\\nНастоящим предоставляется бесплатное разрешение любому лицу, получившему копию\\nэтого программного обеспечения и сопутствующей документации (далее — «Программное обеспечение»),\\nиспользовать Программное обеспечение без ограничений, включая права на просмотр, копирование,\\nизменение, объединение, публикацию, распространение, сублицензирование и/или продажу\\nкопий Программного обеспечения, а также разрешать лицам, которым предоставляется\\nПрограммное обеспечение, делать то же самое, при соблюдении следующих условий:\\n\\nУказанное выше уведомление об авторских правах и данное уведомление о разрешении должны быть включены во все\\nкопии или значительные части Программного обеспечения.\\n\\n--------------------------------------------------------------------------------\\nДОПОЛНИТЕЛЬНЫЕ УСЛОВИЯ, ПОЛОЖЕНИЯ И ОТКАЗ ОТ ОТВЕТСТВЕННОСТИ:\\n\\n1. ОГРАНИЧЕНИЯ ТОВАРНЫХ ЗНАКОВ И БРЕНДИНГА:\\n   Данная лицензия НЕ предоставляет вам никаких прав на использование товарных знаков,\\n   фирменных наименований, логотипов или знаков обслуживания «SGC-NOVUS» или «NOVUS-OS»\\n   любым способом, который подразумевает официальное одобрение, спонсорскую поддержку\\n   или авторство со стороны первоначальных создателей. Измененные дистрибутивы,\\n   использующие эти матрицы, должны быть переименованы во избежание путаницы у пользователей.\\n\\n2. СТОРОННИЕ АКТИВЫ И ЗАВИСИМОСТИ:\\n   Этот репозиторий содержит конфигурации игровых серверов, матрицы и метаданные,\\n   предназначенные для взаимодействия со SteamCMD, инфраструктурой Valve и сторонними API.\\n   Создатели проекта не связаны с Valve Corporation или другими издателями игр.\\n   Все упомянутые игровые активы, логотипы и товарные знаки принадлежат их законным владельцам.\\n\\n3. КОНТЕНТ, СГЕНЕРИРОВАННЫЙ ИИ (ЛОКАЛИЗАЦИИ):\\n   Локализации, описания и структурные метаданные в этом репозитории\\n   автоматически создаются с использованием API Google Gemini AI. Несмотря на применение\\n   строгих конвейеров сборки, переводы могут содержать технические или контекстуальные неточности.\\n   Пользователи используют эти конфигурации на свой собственный операционный риск.\\n\\n--------------------------------------------------------------------------------\\nПРОГРАММНОЕ ОБЕСПЕЧЕНИЕ ПРЕДОСТАВЛЯЕТСЯ «КАК ЕСТЬ», БЕЗ КАКИХ-ЛИБО ГАРАНТИЙ,\\nЯВНЫХ ИЛИ ПОДРАЗУМЕВАЕМЫХ, ВКЛЮЧАЯ, ПОМИМО ПРОЧЕГО, ГАРАНТИИ ТОВАРНОЙ ПРИГОДНОСТИ,\\nСООТВЕТСТВИЯ ОПРЕДЕЛЕННЫМ ЦЕЛЯМ И НЕНАРУШЕНИЯ ПРАВ. НИ ПРИ КАКИХ ОБСТОЯТЕЛЬСТВАХ\\nАВТОРЫ ИЛИ ПРАВООБЛАДАТЕЛИ НЕ НЕСУТ ОТВЕТСТВЕННОСТИ ПО ИСКАМ, ЗА УЩЕРБ ИЛИ ЗА ЛЮБЫЕ ДРУГИЕ\\nТРЕБОВАНИЯ, В РЕЗУЛЬТАТЕ ДЕЙСТВИЯ КОНТРАКТА, ДЕЛИКТА ИЛИ ИНЫМ ОБРАЗОМ, ВОЗНИКАЮЩИЕ ИЗ,\\nИЛИ В СВЯЗИ С ПРОГРАММНЫМ ОБЕСПЕЧЕНИЕМ, ИЛИ ИСПОЛЬЗОВАНИЕМ ПРОГРАММНОГО ОБЕСПЕЧЕНИЯ, ИЛИ ИНЫМИ\\nДЕЙСТВИЯМИ С ПРОГРАММНЫМ ОБЕСПЕЧЕНИЕМ.\"\n}","contributing":"# How to Contribute to NOVUS-OS Matrices\n\nYou can contribute by creating a new pull request or testing existing pull requests. Testing is very important and highly appreciated!\n\n## General Rules for Game Matrices\n\n- **Don't be afraid to submit PRs**. We welcome all contributions! Feel free to open a draft PR if your matrix isn't quite finished yet.\n- **Keep it secure**. Do not include start scripts that a user can easily exploit. If a complex start script is needed, it should be heavily sanitized.\n- **Keep it simple**. We don't need massive install scripts. Keep installation clean, optimized, and readable.\n- **Keep it small**. Only download what is absolutely needed. Use standardized NOVUS-OS core Docker images.\n- **Use Official NOVUS-OS Runtimes**. If you need a specific environment, use our official images. Self-hosted or undocumented third-party images will not be accepted for security reasons.\n- **Export from the Panel**. Please use the NOVUS-OS panel tools to manage and export your matrix JSON files. This ensures the structure remains strictly compliant.\n\n## Making a Pull Request\n\n1. **Test Your Matrix**: Make sure your install process is rock solid. We will test matrices before they are merged.\n2. **Make a Branch**: Please make a separate branch for your work (e.g., `feature/add-minecraft-bedrock`). Do not PR directly from your `main` branch.\n3. **Open a PR**: [Click here to open a Pull Request](https://github.com/SGC-NOVUS/matrices/compare). Ensure your English `.json` matrix is properly formatted. \n4. **AI Security Audit**: All Pull Requests are subject to an automated AI security audit. The AI will scan your matrix for malicious scripts, insecure containers, and compliance with our guidelines. A detailed report will be generated and sent to our team.\n5. **Localization is Automatic**: You DO NOT need to translate your matrix. Simply provide the English JSON, and the NOVUS-OS Compiler will automatically translate your matrix into all supported languages using Gemini AI when we merge it!\n\n---\n\n## Feedback & Support\n\nHave ideas for improvement or found an issue? We are always open to suggestions!\n- **Email:** contribute@sgc-novus.fun"},"uk":{"license":"{\n  \"translation\": \"Ліцензія MIT\\n\\nCopyright (c) 2026 SGC-NOVUS та Учасники <support@sgc-novus.fun>\\n\\nЦим дозволом безоплатно надається будь-якій особі, яка отримує копію\\nцього програмного забезпечення та супутньої документації (далі — «Програмне забезпечення»),\\nправо без обмежень користуватися Програмним забезпеченням, включаючи право на\\nперегляд, копіювання, модифікацію, злиття, публікацію, розповсюдження, субліцензування\\nта/або продаж копій Програмного забезпечення, а також дозволяти особам, яким\\nнадано Програмне забезпечення, робити це за таких умов:\\n\\nВищенаведене повідомлення про авторські права та цей дозвіл мають бути включені в усі\\nкопії або суттєві частини Програмного забезпечення.\\n\\n--------------------------------------------------------------------------------\\nДОДАТКОВІ УМОВИ, ПОЛОЖЕННЯ ТА ВІДМОВИ ВІД ВІДПОВІДАЛЬНОСТІ:\\n\\n1. ОБМЕЖЕННЯ ЩОДО ТОРГОВЕЛЬНИХ МАРК ТА БРЕНДИНГУ:\\n   Ця ліцензія НЕ надає вам жодних прав на використання товарних знаків, фірмових найменувань,\\n   логотипів або знаків обслуговування «SGC-NOVUS» або «NOVUS-OS» у будь-який спосіб, що іплікує\\n   офіційне схвалення, спонсорство чи авторство з боку оригінальних творців.\\n   Модифіковані дистрибутиви, що використовують ці матриці, повинні змінити брендинг, щоб уникнути плутанини серед користувачів.\\n\\n2. СТОРОННІ АКТИВИ ТА ЗАЛЕЖНОСТІ:\\n   Цей репозиторій містить конфігурації ігрових серверів, матриці та метадані,\\n   призначені для взаємодії зі SteamCMD, інфраструктурою Valve та сторонніми API.\\n   Творці проєкту не пов'язані з Valve Corporation чи іншими ігровими видавцями.\\n   Усі згадані ігрові активи, логотипи та торговельні марки належать їхнім відповідним власникам.\\n\\n3. ЗГЕНЕРОВАНИЙ ШІ КОНТЕНТ (ЛОКАЛІЗАЦІЇ):\\n   Локалізації, описи та структурні метадані в цьому репозиторії\\n   створюються автоматично за допомогою API штучного інтелекту Google Gemini. Незважаючи на застосування\\n   суворих конвеєрів збирання, переклади можуть містити технічні або контекстні неточності.\\n   Користувачі впроваджують ці конфігурації на свій власний операційний ризик.\\n\\n--------------------------------------------------------------------------------\\nПРОГРАМНЕ ЗАБЕЗПЕЧЕННЯ НАДАЄТЬСЯ «ЯК Є», БЕЗ ЖОДНИХ ГАРАНТІЙ, ЯВНИХ АБО\\nНЕПРЯМИХ, ВКЛЮЧАЮЧИ, АЛЕ НЕ ОБМЕЖУЮЧИСЬ ГАРАНТІЯМИ MERCHANTABILITY (ПРИДАТНОСТІ ДЛЯ ПЕВНИХ ЦІЛЕЙ),\\nFITNESS FOR A PARTICULAR PURPOSE (ПРИДАТНОСТІ ДЛЯ КОНКРЕТНИХ ЦІЛЕЙ) ТА NON-INFRINGEMENT (НЕНАПРУШЕННЯ ПРАВ). АВТОРИ АБО ПРАВОВЛАСНИКИ НІ ЗА ЯКИХ ОБСТАВИН НЕ НЕСУТЬ ВІДПОВІДАЛЬНОСТІ ЗА БУДЬ-ЯКІ ПОЗОВИ, ШКОДУ ЧИ ІНШУ\\nВІДПОВІДАЛЬНІСТЬ, БУДЬ ТО В РАМКАХ ДОГОВОРУ, ДЕКТУ ЧI ІНШИМ ЧИНОМ, ЩО ВИНИКАЮТЬ З,\\nУ РЕЗУЛЬТАТІ АБО У ЗВ'ЯЗКУ З ПРОГРАМНИМ ЗАБЕЗПЕЧЕННЯМ АБО ВИКОРИСТАННЯМ ІНШИХ ДІЙ З ПРОГРАМНИМ ЗАБЕЗПЕЧЕННЯМ.\"\n}","contributing":"{\n  \"translation\": \"# Як зробити внесок у матриці NOVUS-OS\\n\\nВи можете зробити свій внесок, створивши новий запит на злиття (pull request) або тестуючи наявні запити. Тестування є дуже важливим і високо цінується!\\n\\n## Загальні правила для ігрових матриць\\n\\n- **Не бійтеся надсилати PR**. Ми вітаємо будь-які внески! Не соромтеся відкривати чорновий PR (draft PR), якщо ваша матриця ще не зовсім готова.\\n- **Дбайте про безпеку**. Не включайте скрипти запуску, які користувач може легко зламати. Якщо потрібен складний скрипт запуску, його слід ретельно перевірити та очистити.\\n- **Зберігайте простоту**. Нам не потрібні величезні скрипти встановлення. Зберігайте встановлення чистим, оптимізованим та зрозумілим.\\n- **Тримайте невеликий розмір**. Завантажуйте лише те, що абсолютно необхідно. Використовуйте стандартні базові Docker-образи NOVUS-OS.\\n- **Використовуйте офіційні середовища виконання NOVUS-OS**. Якщо вам потрібне певне середовище, використовуйте наші офіційні образи. З міркувань безпеки сторонні образи, які розміщуються самостійно або не документовані, прийматися не будуть.\\n- **Експортуйте з панелі**. Будь ласка, використовуйте інструменти панелі NOVUS-OS для керування та експорту файлів JSON вашої матриці. Це гарантує, що структура залишатиметься суворо сумісною.\\n\\n## Створення запиту на злиття (Pull Request)\\n\\n1. **Протестуйте свою матрицю**: Переконайтеся, що ваш процес встановлення працює ідеально. Ми будемо тестувати матриці перед їх об'єднанням.\\n2. **Створіть гілку**: Будь ласка, створіть окрему гілку для своєї роботи (наприклад, `feature/add-minecraft-bedrock`). Не надсилайте PR безпосередньо з вашої гілки `main`.\\n3. **Відкрийте PR**: [Клацніть тут, щоб відкрити запит на злиття](https://github.com/SGC-NOVUS/matrices/compare). Переконайтеся, що ваша англійська матриця `.json` правильно відформатована.\\n4. **Аудит безпеки за допомогою штучного інтелекту**: Усі запити на злиття підлягають автоматичному аудиту безпеки ШІ. ШІ просканує вашу матрицю на наявність шкідливих скриптів, небезпечних контейнерів та дотримання наших інструкцій. Детальний звіт буде згенеровано та надіслано нашій команді.\\n5. **Локалізація відбувається автоматично**: Вам НЕ потрібно перекладати вашу матрицю. Просто надайте англійський JSON, і компілятор NOVUS-OS автоматично перекладе вашу матрицю на всі підтримувані мови за допомогою Gemini AI, коли ми її об'єднаємо!\\n\\n---\\n\\n## Відгуки та підтримка\\n\\nМаєте ідеї щодо вдосконалення чи знайшли проблему? Ми завжди відкриті до пропозицій!\\n- **Електронна пошта:** contribute@sgc-novus.fun\"\n}"}},"categories":[{"id":"steamcmd-source","iconUrl":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/steamcmd_source.webp","locales":{"en":{"name":"SteamCMD Servers","description":"Official game servers running on Source engine and SteamCMD architecture."},"ru":{"name":"Серверы SteamCMD","description":"Официальные игровые серверы, работающие на движке Source и архитектуре SteamCMD."},"uk":{"name":"SteamCMD Сервери","description":"Офіційні ігрові сервери, що працюють на рушії Source та архітектурі SteamCMD."}},"games":[{"id":"garrys_mod","iconUrl":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/Garry%60s%20mod/garrys_mod.webp","configUrl":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/Garry%60s%20mod/garrys_mod.json","locales":{"en":{"version":"1.0.0","name":"Garry's Mod","description":"Garry's Mod is a definitive physics sandbox powered by the Source engine. It offers ultimate freedom with no predefined goals — spawn props, build complex contraptions, and install thousands of community addons to run custom gamemodes like Sandbox, DarkRP, TTT, or your own unique creations.","author":"SGC-NOVUS Tech","icon_url":"https://raw.githubusercontent.com/SGC-NOVUS/matrices/main/steamcmd-source/Garry%60s%20mod/garrys_mod.webp","type":"game","slug":"GMOD","run_image":"ghcr.io/sgc-novus/core-images:source","install_image":"ghcr.io/sgc-novus/core-images:source","data_dir":"/home/container","startup_command":"./srcds_run -game garrysmod -console -port {{SERVER_PORT}} +ip 0.0.0.0 +host_workshop_collection {{WORKSHOP_ID}} -authkey {{STEAM_API}} +map {{SRCDS_MAP}} +gamemode {{GAMEMODE}} -strictportbind -norestart +sv_setsteamaccount {{STEAM_GSLT}} +maxplayers {{MAX_PLAYERS}} -tickrate {{TICKRATE}} $( [ \"$LUA_REFRESH\" == \"1\" ] || printf %s '-disableluarefresh' ) +hostname \"{{SERVER_HOSTNAME}}\" +sv_password \"{{SERVER_PASSWORD}}\" +rcon_password \"{{RCON_PASSWORD}}\" +sv_region {{SV_REGION}} +sv_location \"{{SV_LOCATION}}\" +sv_loadingurl \"{{SV_LOADINGURL}}\" +sv_downloadurl \"{{SV_DOWNLOADURL}}\"","stop_command":"quit","install_script":"#!/bin/bash\n# steamcmd Base Installation Script\n## Server Files: /home/container\n## just in case someone removed the defaults.\nif [ \"${STEAM_USER}\" == \"\" ]; then\n    echo -e \"steam user is not set.\\n\"\n    echo -e \"Using anonymous user.\\n\"\n    STEAM_USER=anonymous\n    STEAM_PASS=\"\"\n    STEAM_AUTH=\"\"\nelse\n    echo -e \"user set to ${STEAM_USER}\"\nfi\n\n## download and install steamcmd\ncd /tmp\nmkdir -p /home/container/steamcmd\ncurl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz\ntar -xzvf steamcmd.tar.gz -C /home/container/steamcmd\nmkdir -p /home/container/steamapps # Fix steamcmd disk write error when this folder is missing\ncd /home/container/steamcmd\n\n# SteamCMD fails otherwise for some reason, even running as root.\n# This is changed at the end of the install process anyways.\nchown -R root:root /home/container\nexport HOME=/home/container\n\n## install game using steamcmd\n./steamcmd.sh +force_install_dir /home/container +login ${STEAM_USER:-anonymous} ${STEAM_PASS} ${STEAM_AUTH} $( [[ \"${WINDOWS_INSTALL}\" == \"1\" ]] && printf %s '+@sSteamCmdForcePlatformType windows' || printf %s '+@sSteamCmdForcePlatformType linux' ) +app_update ${SRCDS_APPID:-4020} ${EXTRA_FLAGS} validate +quit\n\n## set up 32 bit libraries\nmkdir -p /home/container/.steam/sdk32\ncp -v linux32/steamclient.so ../.steam/sdk32/steamclient.so\n## set up 64 bit libraries\nmkdir -p /home/container/.steam/sdk64\ncp -v linux64/steamclient.so ../.steam/sdk64/steamclient.so\n\n## set up MySQLOO\necho \"=== Установка последней версии MySQLOO ===\"\nmkdir -p /home/container/garrysmod/lua/bin\ncd /home/container\nLATEST_MYSQLOO=$(curl -s https://api.github.com/repos/FredyH/MySQLOO/releases/latest | jq -r '.assets[] | select(.name == \"gmsv_mysqloo_linux.dll\") | .browser_download_url')\n\nif [ -n \"$LATEST_MYSQLOO\" ] && [ \"$LATEST_MYSQLOO\" != \"null\" ]; then\n    curl -sL \"$LATEST_MYSQLOO\" -o /home/container/garrysmod/lua/bin/gmsv_mysqloo_linux.dll\n    echo \"MySQLOO успешно скачан и установлен.\"\nelse\n    echo \"Ошибка получения ссылки на MySQLOO.\"\nfi\n\n# Creating needed default files for the game\ncd /home/container/garrysmod/lua/autorun/server\necho '-- Docs: https://wiki.garrysmod.com/page/resource/AddWorkshop\n-- Place the ID of the workshop addon you want to be downloaded to people who join your server, not the collection ID\n-- Use https://beta.configcreator.com/create/gmod/resources.lua to easily create a list based on your collection ID\nresource.AddWorkshop( \"\" )' > workshop.lua\n\ncd /home/container/garrysmod/cfg\necho '// Please do not set RCon, Hostname, Password, Region, Location or URLs in here; use the startup parameters in panel.\n\n// Steam Server List Settings\nsv_lan \"0\"\nsv_max_queries_sec_global \"30000\"\nsv_max_queries_window \"45\"\nsv_max_queries_sec \"5\"\n\n// Server Limits\nsbox_maxprops       100\nsbox_maxragdolls    5\nsbox_maxnpcs        10\nsbox_maxballoons    10\nsbox_maxeffects     10\nsbox_maxdynamite    10\nsbox_maxlamps       10\nsbox_maxthrusters   10\nsbox_maxwheels      10\nsbox_maxhoverballs  10\nsbox_maxvehicles    20\nsbox_maxbuttons     10\nsbox_maxsents       20\nsbox_maxemitters    5\nsbox_godmode        0\nsbox_noclip         0\n\n// Network Settings - Please keep these set to default.\nsv_minrate          75000\nsv_maxrate          0\ngmod_physiterations 2\nnet_splitpacket_maxrate 45000\ndecalfrequency      12\n\n// Execute Ban Files - Please do not edit\nexec banned_ip.cfg\nexec banned_user.cfg\n\n// Add custom lines under here' > server.cfg","ports_config":{"client":{"name":"Client Port","default_port":27005,"protocol":"udp","env_variable":"CLIENT_PORT","description":"Port used by the game client to connect."},"primary":{"name":"Primary Port","default_port":27015,"protocol":"tcp+udp","env_variable":"SERVER_PORT","description":"Primary server port used for connections and RCON."},"reserve":{"name":"Reserve Port","default_port":27016,"protocol":"tcp+udp","env_variable":"SERVER_PORT_RESERVE","description":"Reserve server port allocated in case of primary port issues or secondary services."},"sourcetv":{"name":"SourceTV Port","default_port":27025,"protocol":"udp","env_variable":"SOURCETV_PORT","description":"Port used for broadcasting matches via SourceTV."}},"variables":[{"name":"Server Hostname","description":"The public name of your server displayed in the server browser.","env_variable":"SERVER_HOSTNAME","default_value":"New Gmod Server","user_viewable":true,"user_editable":true,"rules":"required|string|max:128","ui_group":"general"},{"name":"Server Password","description":"Password to protect the server. Leave empty for a public server.","env_variable":"SERVER_PASSWORD","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|max:64","ui_group":"security"},{"name":"RCON Password","description":"Password used for remote console access. Leave empty to completely disable RCON (Recommended for security).","env_variable":"RCON_PASSWORD","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|max:64","ui_group":"security"},{"name":"Steam Region","description":"The geographic region for the Steam master server browser.","env_variable":"SV_REGION","default_value":"255","user_viewable":true,"user_editable":true,"type":"select","options_source":"steam_regions","rules":"required|integer","ui_group":"general"},{"name":"Server Location","description":"Two-letter country code (ISO 3166-1 alpha-2) to display the correct flag in the server browser.","env_variable":"SV_LOCATION","default_value":"ua","user_viewable":true,"user_editable":true,"type":"select","options_source":"countries_iso2","rules":"required|string|size:2","ui_group":"general"},{"name":"Loading Screen URL","description":"Custom loading screen URL. Supports %s (SteamID64) and %m (map).","env_variable":"SV_LOADINGURL","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string","ui_group":"gameplay"},{"name":"FastDL URL","description":"HTTP(S) URL for FastDL to speed up custom content downloads.","env_variable":"SV_DOWNLOADURL","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string","ui_group":"security"},{"name":"Map","description":"The default map loaded when the server starts. Ensure the map is installed or included in Workshop.","env_variable":"SRCDS_MAP","default_value":"gm_flatgrass","user_viewable":true,"user_editable":true,"rules":"required|string|alpha_dash","ui_group":"gameplay"},{"name":"Steam Account Token (GSLT)","description":"Generate it at: https://steamcommunity.com/dev/managegameservers (Use AppID 4000).","env_variable":"STEAM_GSLT","default_value":"","user_viewable":true,"user_editable":true,"rules":"nullable|string|alpha_num|size:32","ui_group":"security"},{"name":"Game AppID (Client)","description":"AppID 4000 is the Garry's Mod client identifier. Used by panel auto-generators. Do not modify.","env_variable":"GAME_APPID","default_value":"4000","user_viewable":false,"user_editable":false,"rules":"required|integer|in:4000"},{"name":"Source AppID (Server)","description":"AppID 4020 is used by SteamCMD to download server files. Do not modify.","env_variable":"SRCDS_APPID","default_value":"4020","user_viewable":false,"user_editable":false,"rules":"required|integer|in:4020"},{"name":"Workshop ID","description":"The ID of your Steam Workshop collection (numbers at the end of the URL).", <body class="relative min-h-screen flex flex-col">
    <div class="bg-glow"></div>
    
    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-50 w-full border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                    <img src="https://github.com/SGC-NOVUS.png" alt="SGC-NOVUS" class="h-8 w-8 rounded-md">
                    <span class="font-bold text-xl tracking-tight">NOVUS-OS <span class="text-novus-accent">Matrices</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <select id="lang-select" onchange="setLang(this.value)" class="bg-novus-800 text-white text-sm rounded-lg focus:ring-novus-accent focus:border-novus-accent block px-2 py-1 outline-none border border-white/10 cursor-pointer">
                    </select>
                    <a href="https://github.com/${REPO_OWNER_NAME}" class="text-gray-400 hover:text-white transition-colors"><i class="fab fa-github text-xl"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        
        <!-- View: HOME -->
        <div id="view-home" class="view-section hidden">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4" data-i18n="title"></h1>
                <p class="text-lg text-gray-400 max-w-2xl mx-auto" data-i18n="subtitle"></p>
                <div class="mt-8 flex justify-center gap-4">
                    <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium text-gray-300"><i class="fas fa-folder-tree mr-2 text-novus-accent"></i><span id="cat-count"></span> <span data-i18n="categories"></span></div>
                    <div class="glass-panel px-4 py-2 rounded-full text-sm font-medium text-gray-300"><i class="fas fa-globe mr-2 text-novus-accent"></i><span id="loc-count"></span> <span data-i18n="locales"></span></div>
                </div>
            </div>
            
            <div class="flex justify-center gap-6 mb-12">
                <button onclick="navigate('doc', 'license')" class="glass-panel hover:bg-white/5 text-gray-300 font-semibold py-2 px-6 rounded-lg transition-colors"><i class="fas fa-file-contract mr-2"></i> <span data-i18n="license"></span></button>
                <button onclick="navigate('doc', 'contributing')" class="glass-panel hover:bg-white/5 text-gray-300 font-semibold py-2 px-6 rounded-lg transition-colors"><i class="fas fa-hands-helping mr-2"></i> <span data-i18n="contributing"></span></button>
            </div>

            <h2 class="text-2xl font-bold mb-6 border-b border-white/10 pb-2" data-i18n="browse"></h2>
            <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: CATEGORY -->
        <div id="view-category" class="view-section hidden">
            <button onclick="navigate('home')" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            <div class="flex items-center gap-4 mb-10 pb-4 border-b border-white/10">
                <img id="cat-icon" src="" class="h-14 w-14 rounded-xl shadow-lg">
                <div>
                    <h2 id="cat-title" class="text-3xl font-bold"></h2>
                    <p id="cat-desc" class="text-gray-400 mt-1"></p>
                </div>
            </div>
            <h3 class="text-xl font-bold mb-6" data-i18n="avail"></h3>
            <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: GAME DOCS -->
        <div id="view-game" class="view-section hidden">
            <button id="btn-back-cat" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            
            <div class="glass-panel rounded-2xl p-8 mb-8">
                <div class="flex items-start md:items-center gap-6 flex-col md:flex-row">
                    <img id="game-icon" src="" class="h-24 w-24 rounded-2xl shadow-xl border border-white/10">
                    <div class="flex-grow">
                        <h2 id="game-title" class="text-3xl font-bold mb-2"></h2>
                        <p id="game-desc" class="text-gray-400"></p>
                    </div>
                    <a id="game-dl-btn" href="#" download class="bg-novus-accent hover:bg-novus-accentHover text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-novus-accent/20 flex items-center whitespace-nowrap">
                        <i class="fas fa-download mr-2"></i> <span data-i18n="configBtn"></span> (JSON)
                    </a>
                </div>
            </div>

            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2" data-i18n="ports"></h3>
                    <div class="overflow-x-auto rounded-xl border border-white/10">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-white/5 text-gray-300 text-sm">
                                <tr>
                                    <th class="p-4" data-i18n="portName"></th>
                                    <th class="p-4" data-i18n="default"></th>
                                    <th class="p-4" data-i18n="protocol"></th>
                                    <th class="p-4" data-i18n="desc"></th>
                                </tr>
                            </thead>
                            <tbody id="ports-tbody" class="text-sm divide-y divide-white/5 bg-black/20"></tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2" data-i18n="vars"></h3>
                    <div class="overflow-x-auto rounded-xl border border-white/10">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-white/5 text-gray-300 text-sm">
                                <tr>
                                    <th class="p-4" data-i18n="variable"></th>
                                    <th class="p-4" data-i18n="envKey"></th>
                                    <th class="p-4" data-i18n="default"></th>
                                    <th class="p-4" data-i18n="rules"></th>
                                </tr>
                            </thead>
                            <tbody id="vars-tbody" class="text-sm divide-y divide-white/5 bg-black/20"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: MARKDOWN DOCS -->
        <div id="view-doc" class="view-section hidden">
            <button onclick="navigate('home')" class="mb-6 text-gray-400 hover:text-white flex items-center text-sm font-semibold transition-colors"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="backToRoot"></span></button>
            <div id="doc-content" class="glass-panel rounded-2xl p-8 markdown-body"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-auto bg-novus-900/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
            <p class="text-gray-300 font-semibold mb-1" data-i18n="footerCopyright"></p>
            <p class="text-gray-500 text-sm mb-4" data-i18n="footerDeveloped"></p>
            <p class="text-gray-600 text-xs max-w-3xl mx-auto" data-i18n="footerDisclaimer"></p>
        </div>
    </footer>

    <!-- Application Logic -->
    <script>
        const data = window.SITE_DATA;
        const stored = localStorage.getItem('novus_lang');
        const browser = navigator.language.slice(0,2);
        let currentLang = stored || (data.langs.includes(browser) ? browser : 'en');
        if (!data.langs.includes(currentLang)) currentLang = 'en';
        
        let currentView = 'home';
        let currentContext = null;

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('novus_lang', l);
            render();
        }

        function navigate(view, context = null) {
            currentView = view;
            currentContext = context;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        function render() {
            const ui = data.ui[currentLang] || data.ui.en;
            
            // Render UI Strings
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (ui[k]) el.innerHTML = ui[k];
            });

            // Render Lang Select
            const langSel = document.getElementById('lang-select');
            langSel.innerHTML = data.langs.map(l => `<option value="${l}" ${l === currentLang ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('');

            // View Management
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + currentView).classList.remove('hidden');

            if (currentView === 'home') {
                document.getElementById('cat-count').innerText = data.categories.length;
                document.getElementById('loc-count').innerText = data.langs.length;
                
                let html = '';
                data.categories.forEach(cat => {
                    const lCat = cat.locales[currentLang] || cat.locales.en;
                    html += `
                        <div class="glass-panel rounded-2xl p-6 game-card cursor-pointer flex flex-col justify-center h-full" onclick="navigate('category', '${cat.id}')">
                            <div class="flex items-center gap-4">
                                <img src="${cat.iconUrl}" class="h-16 w-16 rounded-xl shadow-md border border-white/5">
                                <div>
                                    <h3 class="text-xl font-bold">${lCat.name || cat.locales.en.name}</h3>
                                    <p class="text-sm text-gray-400 mt-1 line-clamp-2">${lCat.description || cat.locales.en.description}</p>
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('categories-grid').innerHTML = html;
            }
            else if (currentView === 'category') {
                const cat = data.categories.find(c => c.id === currentContext);
                const lCat = cat.locales[currentLang] || cat.locales.en;
                document.getElementById('cat-title').innerText = lCat.name || cat.locales.en.name;
                document.getElementById('cat-desc').innerText = lCat.description || cat.locales.en.description;
                document.getElementById('cat-icon').src = cat.iconUrl;

                let html = '';
                cat.games.forEach(game => {
                    const lGame = game.locales[currentLang] || game.locales.en;
                    html += `
                        <div class="glass-panel rounded-2xl p-6 game-card flex flex-col h-full cursor-pointer" onclick="navigate('game', {cat: '${cat.id}', game: '${game.id}'})">
                            <div class="flex items-start gap-4 mb-4">
                                <img src="${game.iconUrl}" class="h-14 w-14 rounded-xl shadow-md border border-white/5">
                                <div>
                                    <h3 class="text-lg font-bold leading-tight mb-1">${lGame.name || game.locales.en.name}</h3>
                                    <span class="text-[10px] font-bold uppercase tracking-wider bg-novus-accent/20 text-novus-accent px-2 py-0.5 rounded border border-novus-accent/20">JSON</span>
                                </div>
                            </div>
                            <p class="text-gray-400 text-sm flex-grow mb-6 line-clamp-3">${lGame.description || game.locales.en.description}</p>
                            <div class="flex gap-3 mt-auto">
                                <a href="${game.configUrl}" onclick="event.stopPropagation()" class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-center text-sm font-semibold py-2 px-3 rounded-lg transition-colors" download>
                                    <i class="fas fa-download mr-1"></i> ${ui.configBtn}
                                </a>
                                <button class="flex-1 bg-novus-accent/10 hover:bg-novus-accent/20 text-novus-accent border border-novus-accent/20 text-center text-sm font-semibold py-2 px-3 rounded-lg transition-colors">
                                    <i class="fas fa-book mr-1"></i> ${ui.docsBtn}
                                </button>
                            </div>
                        </div>`;
                });
                document.getElementById('games-grid').innerHTML = html;
            }
            else if (currentView === 'game') {
                const cat = data.categories.find(c => c.id === currentContext.cat);
                const game = cat.games.find(g => g.id === currentContext.game);
                const lGame = game.locales[currentLang] || game.locales.en;
                
                document.getElementById('btn-back-cat').onclick = () => navigate('category', cat.id);
                document.getElementById('game-title').innerText = lGame.name || game.locales.en.name;
                document.getElementById('game-desc').innerText = lGame.description || game.locales.en.description;
                document.getElementById('game-icon').src = game.iconUrl;
                document.getElementById('game-dl-btn').href = game.configUrl;

                let portsHtml = '';
                const ports = lGame.ports_config || game.locales.en.ports_config || {};
                const enPorts = game.locales.en.ports_config || {};
                Object.keys(enPorts).forEach(pk => {
                    const ep = enPorts[pk];
                    const p = ports[pk] || ep;
                    portsHtml += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="p-4 font-semibold">${p.name || ep.name}</td>
                            <td class="p-4"><code class="text-novus-accent bg-novus-accent/10 px-2 py-1 rounded">${ep.default_port}</code></td>
                            <td class="p-4"><span class="text-xs font-bold bg-white/10 px-2 py-1 rounded uppercase tracking-wider">${ep.protocol}</span></td>
                            <td class="p-4 text-gray-400">${p.description || ep.description}</td>
                        </tr>`;
                });
                document.getElementById('ports-tbody').innerHTML = portsHtml;

                let varsHtml = '';
                const lVars = lGame.variables || {};
                const enVars = game.locales.en.variables || [];
                enVars.forEach(ev => {
                    const lv = Array.isArray(lVars) ? lVars.find(v => v.env_variable === ev.env_variable) : lVars[ev.env_variable];
                    const vName = lv?.name || ev.name;
                    const vDesc = lv?.description || ev.description;
                    varsHtml += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="p-4">
                                <div class="font-semibold text-white">${vName}</div>
                                <div class="text-xs text-gray-500 mt-1">${vDesc}</div>
                            </td>
                            <td class="p-4"><code class="text-purple-400 bg-purple-400/10 px-2 py-1 rounded">${ev.env_variable}</code></td>
                            <td class="p-4"><code class="text-gray-300 bg-white/5 px-2 py-1 rounded">${ev.default_value || 'None'}</code></td>
                            <td class="p-4"><code class="text-yellow-400 bg-yellow-400/10 px-2 py-1 rounded text-xs">${ev.rules}</code></td>
                        </tr>`;
                });
                document.getElementById('vars-tbody').innerHTML = varsHtml;
            }
            else if (currentView === 'doc') {
                const md = data.docs[currentLang]?.[currentContext] || data.docs.en[currentContext] || '# Document not found';
                document.getElementById('doc-content').innerHTML = marked.parse(md);
            }
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>

name: NOVUS-OS AI PR Review & Security Audit

on:
  pull_request:
    paths:
      - '**/*.json'
      - '!locales/**'

jobs:
  ai-audit:
    name: AI Matrix Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff to work

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run AI Security Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/pr-review.js

      - name: Read Report Content
        id: read-report
        run: |
          if [ -f review_report.md ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            
            # We will use the file attachment feature of the mail action instead of passing content as body string
            # to avoid complex bash newline escaping issues which often break markdown formatting.
            
            AUTHOR_NAME="${{ github.event.pull_request.user.login }}"
            echo "author=$AUTHOR_NAME" >> $GITHUB_OUTPUT
            PR_URL="${{ github.event.pull_request.html_url }}"
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Email Report
        if: steps.read-report.outputs.report_exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "NOVUS-OS AI Audit: PR from ${{ steps.read-report.outputs.author }}"
          to: contribute@sgc-novus.fun
          from: "NOVUS-OS AI Compiler <contribute@sgc-novus.fun>"
          body: |
            Hello,
            
            A new Pull Request has been submitted to the NOVUS-OS Matrices repository by: ${{ steps.read-report.outputs.author }}.
            
            You can review the PR here: ${{ steps.read-report.outputs.pr_url }}
            
            The Gemini AI Compiler has automatically performed a security audit on the modified matrices. 
            The full Markdown report is attached to this email.
            
            Best regards,
            NOVUS-OS AI Systems
          attachments: review_report.md

name: NOVUS-OS Matrix Compiler CI/CD

# Workflow triggered on push to main branch and manual dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch: # Enable manual execution from the GitHub Actions UI

# Define strict permissions for the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    name: Compile & Translate Matrices
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.NOVUS_BOT_TOKEN || github.token }}

      # 2. Setup Node.js environment with NPM dependency caching
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './scripts/package-lock.json'

      # 3. Install project dependencies
      - name: Install Dependencies
        working-directory: ./scripts
        run: npm ci || npm install @google/generative-ai

      # 4. Execute the NOVUS-OS Compiler scripts
      - name: Execute Compiler Pipeline
        working-directory: ./scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node compile.js

      # 5. Commit and push the generated artifacts
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "build(compiler): auto-generate matrices and translations" || echo "No changes to commit"
          git push